<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag - OWGT Rewards Library</title>
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  
  <style>
    .nav-mast { display: grid; gap: var(--space-2xs); padding: var(--space-md) var(--page-gutter) 0; text-align: center; }
    .mast-name { font-family: var(--font-display); font-size: clamp(2.25rem, 5vw, 3.75rem); letter-spacing: -0.01em; line-height: 0.95; margin: 0; color: var(--color-ink); }
    .mast-line { font-variant: small-caps; letter-spacing: 0.08em; font-size: var(--text-xs); color: var(--color-muted); font-family: var(--font-outlier); }
    .mast-nav ul { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: var(--space-md); list-style: none; padding: 0; margin: var(--space-2xs) 0 0; }
    .mast-nav a { font-family: var(--font-outlier); text-transform: uppercase; font-size: var(--text-sm); letter-spacing: var(--ls-label); }
    .mast-nav a:hover, .mast-nav a.active { color: var(--color-accent); }
    .mast-rule.double { border: 0; border-top: 1px solid var(--color-ink); border-bottom: 1px solid var(--color-ink); height: 4px; margin: var(--space-sm) 0 0; }
    
    .tag-header {
      padding: var(--space-3xl) var(--page-gutter) var(--space-xl);
      text-align: center;
      background: var(--color-paper-2);
      border-bottom: 2px solid var(--color-ink);
    }
  </style>
</head>
<body>
    <header class="new-global-header" id="globalHeader">
  <div class="new-header-left">
    <a href="/home" class="new-logo-link">
      <img src="/owgt-rewards-logo.png?v=3" alt="OWGT Rewards Logo" class="new-header-logo">
      <span class="new-header-title">OWGT Rewards</span>
    </a>
  </div>
  <nav class="new-header-nav" aria-label="Primary">
    <ul>
      <li><a href="/prompts">Prompts</a></li>
      <li><a href="/tools">Tools</a></li>
      <li><a href="/learning">Learning</a></li>
      <li><a href="/resources">Resources</a></li>
      <li><a href="/tags">Tags</a></li>
      <li><a href="/bookmarks">Bookmarks</a></li>
    </ul>
  </nav>
  <div class="new-header-right">
    <!-- Search Trigger Icon -->
    <button id="searchTriggerBtn" class="search-trigger-btn" aria-label="Open Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
    
    <!-- Expanded Search Container -->
    <div id="headerSearchContainer" class="header-search-container" style="display: none;">
      <!-- Step 1: Scope Selection -->
      <div id="searchScopeSelect" class="search-scope-select">
        <button class="scope-btn" data-scope="global">All Rewards</button>
        <button class="scope-btn" data-scope="local" id="localScopeBtn">Current Category</button>
      </div>
      
      <!-- Step 2: Search Input -->
      <div id="searchInputWrapper" class="search-input-wrapper" style="display: none;">
        <div class="active-scope-pill" id="activeScopePill">All Rewards</div>
        <input type="text" id="headerSearchInput" placeholder="Search..." autocomplete="off">
        <button id="executeSearchBtn" class="execute-search-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <button id="closeSearchBtn" class="close-search-btn" aria-label="Close Search">✕</button>
      </div>
    </div>
  </div>
</header>


























  <main class="page-wrap">
    <header class="tag-header">
      <div class="container container--narrow">
        <p class="eyebrow" style="color: var(--color-accent); margin-bottom: var(--space-sm);">◆ TAG DIRECTORY</p>
        <h1 id="tag-title" class="display-hero" style="font-size: clamp(2rem, 5vw, 4rem); text-transform: lowercase;">Loading...</h1>
        <p id="tag-count-text" style="margin: var(--space-md) auto 0; font-size: var(--text-lg);"></p>
      </div>
    </header>

    <section class="section">
      <div class="container container--wide">
        <div id="tag-results" class="card-grid card-grid--4">
          <p style="font-family: var(--font-outlier); text-align: center;">Loading resources...</p>
        </div>
      </div>
    </section>
  </main>
  
  <footer class="foot-mast" style="padding: var(--space-3xl) var(--page-gutter); text-align: center; border-top: 2px solid var(--color-ink);">
    <div class="container" style="display: flex; flex-direction: column; align-items: center;">
      <p class="wordmark" style="font-family: var(--font-display); font-size: var(--text-2xl); font-variation-settings: 'wdth' 110, 'wght' 800; text-transform: uppercase;">OWGT Rewards</p>
      <p class="links muted" style="margin-top: var(--space-xs); font-family: var(--font-outlier); text-transform: uppercase; font-size: var(--text-xs);">© 2026 OWGT</p>
      <p class="mast-line" style="margin-top: 8px;">MADE BY ARHAM</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const tagName = params.get('tag');
      
      if (!tagName) {
        document.getElementById('tag-title').textContent = 'No tag specified';
        document.getElementById('tag-results').innerHTML = '<p style="text-align:center;">Please select a tag from the <a href="tags" style="text-decoration: underline;">tag directory</a>.</p>';
        return;
      }
      
      document.title = `#${tagName} - OWGT Rewards Library`;
      document.getElementById('tag-title').textContent = `#${tagName}`;
      
      fetch('/data.json')
        .then(res => res.json())
        .then(data => {
          const items = data.items.filter(item => 
            item.tags && item.tags.some(t => t.toLowerCase() === tagName.toLowerCase())
          );
          
          document.getElementById('tag-count-text').textContent = `${items.length} resources found matching this tag.`;
          
          const grid = document.getElementById('tag-results');
          
          if (items.length === 0) {
            grid.innerHTML = '<p style="text-align:center; font-family: var(--font-outlier);">No resources found for this tag.</p>';
            return;
          }
          
          const escapeHTML = str => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
              '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
          };
          
          grid.innerHTML = items.map(item => {
            if (item.is_shallow) {
              return `
                <div class="card card--expandable" style="--cat-color: var(--color-accent-2);">
                  <div class="card__accent-strip"></div>
                  <div class="card__body">
                    <h3 class="card__title">${escapeHTML(item.name)}</h3>
                    <p class="card__desc">${escapeHTML(item.description)}</p>
                  </div>
                  <button class="card__expand-btn" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); this.nextElementSibling.classList.toggle('is-open');">
                    <span>Quick View</span>
                    <span class="card__expand-arrow">↓</span>
                  </button>
                  <div class="card__expand-content">
                    <p style="font-size: var(--text-sm);">${escapeHTML(item.description)}</p>
                    ${item.url ? `<a href="${escapeHTML(item.url)}" target="_blank" class="btn btn--primary" style="margin-top: var(--space-sm); width: 100%;">Visit Resource ↗</a>` : ''}
                  </div>
                </div>`;
            } else {
              return `
                <a href="${escapeHTML(item.path)}" class="card" style="--cat-color: var(--color-cat-prompts);">
                  <div class="card__accent-strip"></div>
                  <div class="card__body">
                    <h3 class="card__title">${escapeHTML(item.name)}</h3>
                    <p class="card__desc">${escapeHTML(item.description)}</p>
                  </div>
                  <div class="card__footer">
                    <span class="meta">${escapeHTML(item.category)}</span>
                    <span class="card__expand-arrow">→</span>
                  </div>
                </a>`;
            }
          }).join('');
          
          // Re-init expandable cards for dynamically added ones
          if (typeof initExpandableCards === 'function') initExpandableCards();
        })
        .catch(err => {
          console.error('Error loading tag data:', err);
          document.getElementById('tag-results').innerHTML = '<p style="text-align:center;">Error loading data.</p>';
        });
    });
  </script>
</body>
</html>
