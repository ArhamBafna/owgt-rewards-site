<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{category} - OWGT Rewards Library</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  {header}
  <main class="page-wrap">
    <header class="category-header">
      <div class="container container--narrow">
        <h1 class="display-hero" style="font-size: clamp(2rem, 5vw, 4rem);">{category_upper}</h1>
        <p style="margin: var(--space-md) auto 0; font-size: var(--text-lg);">{item_count} curated entries.</p>
      </div>
    </header>

    <section class="section">
      <div class="container container--wide">
        <div class="card-grid card-grid--4">
          {cards_html}
        </div>
      </div>
    </section>
  </main>

  <footer class="foot-mast">
    <div class="container">
      <p class="wordmark">OWGT Rewards</p>
      <p class="links muted">© 2026 OWGT</p>
      <p class="mast-line" style="margin-top: 8px;">MADE BY ARHAM</p>
    </div>
  </footer>
  <script src="/js/app.js"></script>
</body>
</html>
