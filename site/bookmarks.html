<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved - OWGT Rewards Library</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <!-- HEADER_START -->
<header class="new-global-header" id="globalHeader">
  <div class="new-header-left">
    <a href="/rewards" class="new-logo-link">
      <img src="/favicon.png" alt="OWGT Rewards Logo" class="new-header-logo">
      <span class="new-header-title">OWGT Rewards</span>
    </a>
  </div>
  <nav class="new-header-nav" aria-label="Primary">
    <ul>
      <li><a href="/prompts">Prompts</a></li>
      <li><a href="/tools">Tools</a></li>
      <li><a href="/learning">Learning</a></li>
      <li><a href="/resources">Resources</a></li>
      <li><a href="/tags">Tags</a></li>
      <li><a href="/bookmarks">Saved <span id="navSavedBadge" class="nav__badge" style="display: none;">0</span></a></li>
    </ul>
  </nav>
  <div class="new-header-right">
    <button id="searchTriggerBtn" class="search-trigger-btn" aria-label="Open Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
    <div id="headerSearchContainer" class="header-search-container" style="display: none;">
      <div id="searchScopeSelect" class="search-scope-select">
        <button class="scope-btn" data-scope="global">All Rewards</button>
        <button class="scope-btn" data-scope="local" id="localScopeBtn">Current Category</button>
      </div>
      <div id="searchInputWrapper" class="search-input-wrapper" style="display: none;">
        <div class="active-scope-pill" id="activeScopePill">All Rewards</div>
        <input type="text" id="headerSearchInput" placeholder="Search..." autocomplete="off">
        <button id="executeSearchBtn" class="execute-search-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <button id="closeSearchBtn" class="close-search-btn" aria-label="Close Search">✕</button>
      </div>
    </div>
  </div>
</header>
<!-- HEADER_END -->


















  <main class="page-wrap">
    <header class="category-header">
      <div class="container container--narrow">
        <h1 class="display-hero" style="font-size: clamp(2rem, 5vw, 4rem);">SAVED</h1>
        <p id="saved-count-text" style="margin: var(--space-md) auto 0; font-size: var(--text-lg);">0 saved entries.</p>
      </div>
    </header>

    <section class="section">
      <div class="container container--wide">
        <div id="saved-cards-grid" class="card-grid card-grid--4">
          <p style="font-family: var(--font-outlier); text-align: center; grid-column: 1 / -1;">Loading saved vault items...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot-mast">
    <div class="container">
      <p class="wordmark">OWGT Rewards</p>
      <p class="links muted">© 2026 OWGT</p>
      <p class="mast-line" style="margin-top: 8px;">MADE BY ARHAM</p>
    </div>
  </footer>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSavedPage();
    });

    function renderSavedPage() {
      const countEl = document.getElementById('saved-count-text');
      const gridEl = document.getElementById('saved-cards-grid');
      if (!gridEl) return;

      const bookmarks = JSON.parse(localStorage.getItem('owgt_bookmarks') || '[]');
      const bookmarkIds = bookmarks.map(b => b.id);

      if (bookmarkIds.length === 0) {
        if (countEl) countEl.textContent = '0 saved entries.';
        gridEl.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: var(--space-3xl) var(--space-md); margin: 0 auto; width: 100%;">
            <h2 style="font-family: var(--font-display); font-size: var(--text-2xl); text-transform: uppercase; margin: 0 auto var(--space-xs); max-width: none;">Your Saved Vault is Empty</h2>
            <p style="font-family: var(--font-body); color: var(--color-muted); max-width: 480px; margin: 0 auto var(--space-lg);">Click "♡ Save" on any prompt, tool, or guide across the library to pin it here for rapid access.</p>
            <a href="/rewards" class="btn btn--primary" style="display: inline-block;">Browse Rewards Library →</a>
          </div>`;
        return;
      }

      window.owgtDataPromise
        .then(data => {
          const itemsMap = {};
          (data.items || []).forEach(it => { itemsMap[it.id] = it; });

          // Retain order of bookmarks as saved by user
          const savedItems = bookmarkIds.map(id => itemsMap[id]).filter(Boolean);
          
          if (countEl) countEl.textContent = `${savedItems.length} saved entries.`;

          if (savedItems.length === 0) {
            gridEl.innerHTML = `
              <div style="grid-column: 1 / -1; text-align: center; padding: var(--space-3xl) var(--space-md); margin: 0 auto; width: 100%;">
                <h2 style="font-family: var(--font-display); font-size: var(--text-2xl); text-transform: uppercase; margin: 0 auto var(--space-xs); max-width: none;">Your Saved Vault is Empty</h2>
                <p style="font-family: var(--font-body); color: var(--color-muted); max-width: 480px; margin: 0 auto var(--space-lg);">Click "♡ Save" on any prompt, tool, or guide across the library to pin it here for rapid access.</p>
                <a href="/rewards" class="btn btn--primary" style="display: inline-block;">Browse Rewards Library →</a>
              </div>`;
            return;
          }

          gridEl.innerHTML = savedItems.map(item => window.renderCard(item)).join('');

          if (typeof initBookmarks === 'function') initBookmarks();
          if (typeof initExpandableCards === 'function') initExpandableCards();

          // Hook into bookmark removal specifically for bookmarks page to remove card immediately
          gridEl.querySelectorAll('[data-bookmark-id]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const card = btn.closest('.card');
              if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                card.style.transition = 'all 0.25s ease-out';
                setTimeout(() => {
                  card.remove();
                  const remaining = gridEl.querySelectorAll('.card').length;
                  if (countEl) countEl.textContent = `${remaining} saved entries.`;
                  if (remaining === 0) {
                    renderSavedPage();
                  }
                }, 250);
              }
            });
          });
        })
        .catch(err => {
          console.error('Error loading saved bookmarks data:', err);
          gridEl.innerHTML = '<p style="text-align:center; color: var(--color-muted);">Error loading saved items.</p>';
        });
    }
  </script>
</body>
</html>
