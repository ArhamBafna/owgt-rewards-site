<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Vault - OWGT Rewards Library</title>
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  
  <style>
    .nav-mast { display: grid; gap: var(--space-2xs); padding: var(--space-md) var(--page-gutter) 0; text-align: center; }
    .mast-name { font-family: var(--font-display); font-size: clamp(2.25rem, 5vw, 3.75rem); letter-spacing: -0.01em; line-height: 0.95; margin: 0; color: var(--color-ink); }
    .mast-line { font-variant: small-caps; letter-spacing: 0.08em; font-size: var(--text-xs); color: var(--color-muted); font-family: var(--font-outlier); }
    .mast-nav ul { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: var(--space-md); list-style: none; padding: 0; margin: var(--space-2xs) 0 0; }
    .mast-nav a { font-family: var(--font-outlier); text-transform: uppercase; font-size: var(--text-sm); letter-spacing: var(--ls-label); }
    .mast-nav a:hover, .mast-nav a.active { color: var(--color-accent); }
    .mast-rule.double { border: 0; border-top: 1px solid var(--color-ink); border-bottom: 1px solid var(--color-ink); height: 4px; margin: var(--space-sm) 0 0; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-lg) var(--page-gutter);
      background: var(--color-paper-2);
      border-bottom: 2px solid var(--color-ink);
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-4xl) var(--page-gutter);
      font-family: var(--font-outlier);
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <header class="nav-mast">
    <p class="mast-line">No 01 · Curated AI Library · OWGT Rewards</p>
    <a href="index.html" style="text-decoration: none;"><h1 class="mast-name">OWGT REWARDS</h1></a>
    <nav class="mast-nav" aria-label="Primary">
      <ul>
        <li><a href="prompts.html">Prompts</a></li>
        <li><a href="tools.html">Tools</a></li>
        <li><a href="tags.html">Tags</a></li>
        <li><a href="bookmarks.html" class="active">Bookmarks</a></li>
      </ul>
    </nav>
    <hr class="mast-rule double" aria-hidden="true">
  </header>

  <main class="page-wrap section">
    
    <div class="header-bar">
      <h2 style="font-size: var(--text-2xl);">Your Saved Items</h2>
      <button class="btn btn--secondary" onclick="exportBookmarks()">Export JSON</button>
    </div>
    
    <div class="container container--wide" style="margin-top: var(--space-xl);">
      <div id="bookmarks-grid" class="card-grid card-grid--4">
        <!-- Rendered via JS -->
      </div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <p>Your vault is empty.</p>
        <p style="margin-top: var(--space-sm);">Press 'B' or click "♡ Save" on any resource to add it here.</p>
      </div>
    </div>
  </main>
  
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderBookmarks();
    });
    
    function renderBookmarks() {
      const bookmarks = JSON.parse(localStorage.getItem('owgt_bookmarks') || '[]');
      const grid = document.getElementById('bookmarks-grid');
      const empty = document.getElementById('empty-state');
      
      if (bookmarks.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      
      grid.style.display = 'grid';
      empty.style.display = 'none';
      
      grid.innerHTML = bookmarks.map(b => `
        <a href="${b.path}.html" class="card" style="--cat-color: var(--color-accent-2);">
          <div class="card__accent-strip"></div>
          <div class="card__header" style="display: flex; justify-content: space-between; align-items: start;">
            <span class="tag" style="font-size: 9px; padding: 2px 6px;">${b.category || 'Item'}</span>
            <button class="btn--ghost" onclick="event.preventDefault(); toggleBookmark('${b.id}', '${b.title}', '${b.path}', '${b.category}'); setTimeout(renderBookmarks, 100);" style="border: 1px solid var(--color-ink); background: var(--color-ink); color: var(--color-paper); padding: 2px 6px; font-family: var(--font-outlier); font-size: 10px;">♥ Saved</button>
          </div>
          <div class="card__body">
            <h3 class="card__title">${b.title}</h3>
          </div>
          <div class="card__footer">
            <span class="meta">View</span>
            <span class="card__expand-arrow">→</span>
          </div>
        </a>
      `).join('');
    }
    
    function exportBookmarks() {
      const bookmarks = localStorage.getItem('owgt_bookmarks') || '[]';
      const blob = new Blob([bookmarks], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'owgt_bookmarks.json';
      a.click();
    }
  </script>
</body>
</html>
