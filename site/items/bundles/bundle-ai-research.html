        <h1 class="display-hero" style="font-size: clamp(2.5rem, 6vw, 6rem);">AI Research</h1>

    <section class="section">
      <div class="container container--wide">
        <div class="card-grid card-grid--4">
          <div class="js-card-render" data-item="{&quot;id&quot;:&quot;the-ai-research-system&quot;,&quot;slug&quot;:&quot;the-ai-research-system&quot;,&quot;name&quot;:&quot;The AI Research System: A Three-Phase Method&quot;,&quot;description&quot;:&quot;A systematic three-phase methodology for conducting high-quality, verifiable research using multiple AI models (Perplexity, Grok, Claude, ChatGPT) to avoid hallucinations and generate actionable insights.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Research&quot;,&quot;Workflow&quot;,&quot;Perplexity&quot;,&quot;Claude&quot;,&quot;ChatGPT&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;The output quality of AI research is not determined by which model you use, but by whether you have a process at all. Using one model as your only source is using a single, fallible voice as your entire evidence base. \n\nA better approach is a three-phase process where each phase uses a different tool for a specific job: Gather, Analyze, and Output.\n\n#### Phase 1: Gather\n*The goal is source discovery, web research, market data, and current events. You are looking for sourced, traceable starting material, not AI opinions.*\n\n- **Perplexity**: Search-first AI that always cites sources. It links every answer to the original source material.\n  - *Best Practice*: Ask specific questions. Instead of \&quot;Tell me about competitor X\&quot;, ask: \&quot;What has competitor X announced in the last 90 days? What do their recent job postings suggest about their strategic direction? Cite all sources.\&quot;\n- **Grok**: For real-time intelligence. Connected directly to X data. Use this to track fast-moving markets, competitor announcements, or regulatory developments that haven&#x27;t been indexed by search engines yet.\n\n*Phase 1 Output*: A set of raw, sourced notes, links, and data points ready for synthesis.\n\n#### Phase 2: Analyze\n*The goal is summarizing findings, identifying patterns, synthesizing across sources, extracting key points, and pressure-testing interpretations.*\n\n- **Claude**: Built for long-form thinking, identifying patterns, and synthesizing across multiple sources.\n\n**Key Synthesis Prompts for Claude:**\n- **Research Synthesis**:\n  &gt; I have gathered the following research on [topic]. Synthesize it into a briefing of no more than one page covering: the three most important findings, what these findings mean for our business specifically, the key areas of uncertainty or conflicting evidence, and the one or two questions that still need to be answered before we can act with confidence. Research: [paste in your phase one notes]\n- **Competitive Intelligence**:\n  &gt; Build me a competitive intelligence brief on [competitor]. Based on the following sources and what you know, cover: their current product positioning and how it has changed recently, pricing strategy and packaging, go-to-market approach and primary channels, known strengths and vulnerabilities, recent signals about their strategic direction, and one or two things they are likely to do next. Sources: [paste in your phase one notes]\n- **Industry Trend Analysis**:\n  &gt; Analyze the following trends affecting [your industry]: [list what you found]. For each trend: how material it is likely to be in the next two to three years, whether it represents a threat or an opportunity for our business specifically, what leading companies in our space are doing in response, and what we should be doing now to either capitalize on or protect against it.\n\n**Common Mistakes to Avoid:**\n1. **Trusting first outputs**: Always ask Claude to identify the weakest assumption in its own analysis.\n2. **Weak prompting**: Specificity separates useful synthesis from generic summaries.\n3. **Shallow sourcing**: Phase two cannot fix poor data from phase one. Always verify factual claims against primary sources.\n\n#### Phase 3: Output\n*The goal is turning synthesized insights into a tailored deliverable (reports, memos, briefings).*\n\n- **Claude**: Best for reports, memos, strategy documents, written briefs, and anything requiring voice and judgment.\n- **ChatGPT**: Best for structured formats, data-heavy summaries, and content where pattern/completeness matters more than prose quality.\n\n**The Output Prompt:**\n&gt; I have the following research that I need to present to [audience, leadership, board, client, team]: [describe or paste in your phase two synthesis]. Help me turn this into a narrative that: opens with the single most important finding, builds the supporting evidence in a logical sequence, explains what the data means for our strategy or decisions, and closes with a clear recommendation or call to action. The audience cares most about: [describe what matters to them]&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/the-ai-research-system&quot;,&quot;rel_md_path&quot;:&quot;Guides/the-ai-research-system.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;ai-powered-market-research&quot;,&quot;slug&quot;:&quot;ai-powered-market-research&quot;,&quot;name&quot;:&quot;AI-Powered Market Research&quot;,&quot;description&quot;:&quot;Using AI tools to gather, synthesize, and interpret market data, competitive intelligence, and industry trends faster than traditional research methods.&quot;,&quot;category&quot;:&quot;Learning&quot;,&quot;folder_category&quot;:&quot;Learning&quot;,&quot;category_slug&quot;:&quot;learning&quot;,&quot;tags&quot;:[&quot;AI&quot;,&quot;Analysis &amp; Research&quot;,&quot;Strategy&quot;,&quot;Perplexity&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;What it is: Using AI tools to gather, synthesize, and interpret market data, competitive intelligence, and industry trends faster than traditional research methods.\nWho is hiring: Strategy, marketing, and competitive intelligence functions.\nBeginner: Uses Perplexity to build a sourced market briefing on a topic. Can cite the sources behind key findings.\nAdvanced: Runs a weekly competitive intelligence system using Perplexity, Grok, and Claude.\nTool to start: Perplexity. Start with a specific research question in your market and evaluate the output for source quality.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/learning/ai-powered-market-research&quot;,&quot;rel_md_path&quot;:&quot;Learning/ai-powered-market-research.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;analyze-customer-feedback-for-growth-signals&quot;,&quot;slug&quot;:&quot;analyze-customer-feedback-for-growth-signals&quot;,&quot;name&quot;:&quot;Analyze Customer Feedback for Growth Signals&quot;,&quot;description&quot;:&quot;A strategic template to analyze customer feedback for growth signals.&quot;,&quot;category&quot;:&quot;Prompts&quot;,&quot;folder_category&quot;:&quot;Prompts&quot;,&quot;category_slug&quot;:&quot;prompts&quot;,&quot;tags&quot;:[&quot;Claude&quot;,&quot;Prompt&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;```\nHere is customer feedback I&#x27;ve collected: [paste]. Analyze it for growth signals, not just the satisfaction data, but what it reveals about: the customer segments most likely to expand, the use cases we&#x27;re underdeveloped in, and the competitor we&#x27;re most often replacing or being compared to. Give me the one growth hypothesis this data most supports.\&quot; \&quot;I&#x27;m considering investing [describe resource] in [describe opportunity]. Evaluate the investment on: expected return and time to see it, key assumptions that must hold for the return to materialize, what the minimum viable version of this investment looks like, and at what point I should cut my losses if it&#x27;s not working.\n```&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/prompts/analyze-customer-feedback-for-growth-signals&quot;,&quot;rel_md_path&quot;:&quot;Prompts/analyze-customer-feedback-for-growth-signals.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;analyze-this-data-and-identify&quot;,&quot;slug&quot;:&quot;analyze-this-data-and-identify&quot;,&quot;name&quot;:&quot;Analyze This Data And Identify&quot;,&quot;description&quot;:&quot;Analyzing data.&quot;,&quot;category&quot;:&quot;Prompts&quot;,&quot;folder_category&quot;:&quot;Prompts&quot;,&quot;category_slug&quot;:&quot;prompts&quot;,&quot;tags&quot;:[&quot;Prompt&quot;,&quot;Workflow&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;```text\nAnalyze this data and identify the top 3 trends, 2 anomalies, and 1 key recommendation: [paste data]\n```&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/prompts/analyze-this-data-and-identify&quot;,&quot;rel_md_path&quot;:&quot;Prompts/analyze-this-data-and-identify.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;analyze-why-a-deal-was-lost&quot;,&quot;slug&quot;:&quot;analyze-why-a-deal-was-lost&quot;,&quot;name&quot;:&quot;Analyze Why a Deal Was Lost&quot;,&quot;description&quot;:&quot;A strategic template to analyze why a deal was lost.&quot;,&quot;category&quot;:&quot;Prompts&quot;,&quot;folder_category&quot;:&quot;Prompts&quot;,&quot;category_slug&quot;:&quot;prompts&quot;,&quot;tags&quot;:[&quot;Claude&quot;,&quot;Prompt&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;```\nHere&#x27;s the deal I lost: [describe]. What are the three most likely real reasons, not what they told us, the underlying ones? What do we change next time?\n```&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/prompts/analyze-why-a-deal-was-lost&quot;,&quot;rel_md_path&quot;:&quot;Prompts/analyze-why-a-deal-was-lost.md&quot;}"></div>
