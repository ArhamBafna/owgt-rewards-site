<div class="js-card-render" data-item="{&quot;id&quot;:&quot;5-ai-businesses-to-make-1m&quot;,&quot;slug&quot;:&quot;5-ai-businesses-to-make-1m&quot;,&quot;name&quot;:&quot;5 AI Businesses to Make $1M (With Zero Employees)&quot;,&quot;description&quot;:&quot;A breakdown of 5 high-leverage AI service businesses you can start today, including a 4-step framework for launching.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Business&quot;,&quot;Agent&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;#### The AI Startup Ladder (4-Step Process)\n1. **Validate**: Pick a niche (e.g., med spas, agencies) and do outreach to prove demand.\n2. **Pre-sell**: Sell the service and collect cash before building. Use a simple document with a Stripe checkout link.\n3. **Deliver**: Once paid, drop everything to manually deliver the result within 48 hours. This builds your reputation and earns referrals.\n4. **Build &amp; Automate**: Productize the service to scale deployment.\n\n#### 1. AI Inbox &amp; Calendar Manager (Highest Potential)\n- **What it is**: Building an AI executive assistant to manage emails and meetings for busy CEOs.\n- **Why it works**: Entrepreneurs desperately want to buy back their time.\n- **Income Potential**: $3,000 - $5,000 / day.\n\n#### 2. AI Data Cleanup Agency\n- **What it is**: Organizing a company&#x27;s messy internal data (emails, CRMs, spreadsheets), vectorizing it, and putting an AI search layer on top.\n- **Why it works**: Businesses need to make better decisions based on their own data.\n- **Income Potential**: $1,500 - $3,000 / day.\n\n#### 3. AI Sales Chatbot\n- **What it is**: Creating a chatbot that converts social media chats, texts, and emails into leads and sales.\n- **Why it works**: Business owners get massive inbound engagement but lack time to reply.\n- **Income Potential**: $1,000 - $1,500 / day.\n\n#### 4. AI Content Repurposing Service\n- **What it is**: Turning long-form content (podcasts, webinars) into short-form clips for TikTok/Reels using AI tools.\n- **Why it works**: Algorithms favor niche short-form content.\n- **Income Potential**: $750 - $1,000 / day.\n\n#### 5. AI Appointment Setter\n- **What it is**: Replacing human inbound phone agents with AI voice agents to book sales calls.\n- **Why it works**: Cheaper than a human, available 24/7, and performs incredibly well.\n- **Income Potential**: $500 - $1,000 / day.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/5-ai-businesses-to-make-1m&quot;,&quot;rel_md_path&quot;:&quot;Guides/5-ai-businesses-to-make-1m.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;avoid-chat-limits&quot;,&quot;slug&quot;:&quot;avoid-chat-limits&quot;,&quot;name&quot;:&quot;Avoid Chat Limits&quot;,&quot;description&quot;:&quot;Learn how to avoid context rot and chat limits by editing messages, batching requests, and starting fresh chats often.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Skool&quot;,&quot;Community&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;Every message resends your entire chat history. Message one is tiny. Message 30 is massive. That is why limits hit fast and quality tanks (context rot). \n\nFix the weight. Stop wasting tokens. \n\n---\n\n## 1. Edit Instead of Following Up \nCorrecting a mistake with a new message saves the bad reply, your correction, and the new reply into history. Every future message reprocesses all of that junk.\n\n* **Action:** Edit your original message directly. The bad exchange disappears completely. \n\n---\n\n## 2. Batch Requests Into One Prompt \nThree messages equal three full context reloads. One message with three asks equals one reload. \n\n* **Template:**\n  &gt; Do all of the following in one response:\n  &gt; 1. A 3-sentence summary\n  &gt; 2. The 5 key points as bullets\n  &gt; 3. A 10-word headline\n\n---\n\n## 3. Start a Fresh Chat Often \nLong chats burn millions of tokens reading old history. Reset every 15 to 20 messages.\n\n* **Handoff Prompt:**\n  &gt; Summarize this chat as a handoff document: what we are working on, what is done, what is open, and key constraints. Make it short so I can paste it into a new chat.\n\n---\n\n## 4. Turn Off Extended Thinking \nExtended thinking creates massive output tokens before answering. Output tokens cost way more. Keep it off unless you need heavy reasoning.\n\n---\n\n## 5. Convert Files to Markdown \nPDFs and HTML carry dead weight like fonts, layouts, and images that drain tokens. \n\n* **Action:** Convert files to clean Markdown before uploading. It cuts token weight by up to 90% \ud83d\udcc9.\n\n---\n\n## 6. The Session Reset Trick \nUsage windows start at your very first message of the day.\n\n* **Action:** Send a dummy message early in the morning. Come back hours later for real work. You get two solid sessions instead of getting blocked midday.\n\n---\n\n## 7. Work Off-Peak\nPeak hours bring server congestion and faster session burn. Shift heavy workloads to early mornings, late nights, or weekends.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/avoid-chat-limits&quot;,&quot;rel_md_path&quot;:&quot;Guides/avoid-chat-limits.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;build-10-000-websites-with-ai&quot;,&quot;slug&quot;:&quot;build-10-000-websites-with-ai&quot;,&quot;name&quot;:&quot;Build $10,000 Websites with AI Opus 5&quot;,&quot;description&quot;:&quot;Using AI Opus 5 and the Higgsfield MCP connector to build a fully animated luxury real estate marketing site.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Skool&quot;,&quot;Community&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;## 1. Setup\nYou need two things:\n\nAI Code running in the desktop app.\n\nHiggsfield MCP for visuals, which gives the AI direct access to image and video models without leaving the session.\n\n#### Connecting Higgsfield\n1. Open Higgsfield: https://higgsfield.ai/mcp?fpr=zinho-automates\n2. Copy the MCP URL\n3. In AI Code: Connectors -&gt; Add custom connector\n4. Paste the URL and name it Higgsfield\n5. Approve the authorization page\n\nDone. No API keys.\n\n#### Confirm it worked\nBefore starting a build prompt, run this:\n\n&gt; List the Higgsfield MCP tools you have access to.\n\nIf it comes back empty, the connector didn&#x27;t authorize. Reconnect before going further, or you&#x27;ll get forty minutes into a build with an empty assets folder.\n\n#### Which model\nUse AI Opus 5 (or a similar high-capability reasoning model). It costs about half as much as Fable 5 and handles this type of build at basically the same quality. Set effort to high for the initial build since the extra thinking time helps here.\n\n---\n\n## 2. Build One: Luxury Real Estate\nThe site: THE LEDGE, a $24M cantilevered concrete-and-glass house on the Big Sur cliffs.\n\nCopy the whole thing. Paste into AI Code in an empty folder.\n\n```text\nBuild a fully animated marketing site for THE LEDGE: a $24,000,000 cantilevered\nconcrete-and-glass house on the Big Sur cliffs, listed by MERIDIAN.\n\nGenerate ALL visual assets with the Higgsfield MCP FIRST, then build the site around\nthem. No placeholder images anywhere. Generate the assets, confirm the media IDs,\nthen wire everything in.\n\nTone: modern, bold, architectural. Think a modern design magazine, not a heritage\nbrokerage: oversized sans-serif, hard edges, asymmetric grid, off-white and raw\nconcrete with one electric accent. Nothing ornate, nothing nostalgic, no serif type,\nno gold, no script.\n\n## Asset generation order (do this first)\n\n1. **The master exterior**: the house at golden hour, board-formed concrete,\n   full-height glass, a deep cantilever over the cliff edge, Pacific behind it.\n   Studio-grade architectural photography, wide lens, hard shadows. This is the main\n   asset, and everything else comes from it.\n\n2. **Six interiors**, generated image-to-image FROM the master so materials, light\n   temperature, and grade match exactly: living volume, kitchen, primary suite,\n   bathroom, stair core, pool deck. Same concrete, same glass, same sun angle.\n\n3. **Three detail shots**: concrete texture, a steel-and-glass junction, water on\n   stone. Tight, abstract, near-macro.\n\n4. **Two cutout elements** on clean backgrounds with background removal: an isolated\n   massing view of the house, and a section-cut diagram of the site.\n\n5. **The drone sequence**: four SEPARATE clips, Seedance 2.0, 4K, 4-5 seconds each,\n   colour- and identity-matched to the master. The sequence moves from outside to\n   inside, one space per clip:\n   - **Approach**: fast push along the cliff face, house entering frame late\n   - **Living volume**: hard drop past the cantilever and through the glass into the\n     main living space, concrete walls, ocean filling the far wall\n   - **Kitchen**: quick lateral sweep across the island, steel and stone\n   - **Primary suite**: rapid pull-back from the bed to reveal the full glass wall\n     and the drop beyond it\n\n   **Fast, decisive camera moves, not slow drifts.** Each clip should feel like a cut\n   in a trailer. Combine the four into one continuous file with hard cuts, no\n   crossfades. Note the exact timestamp where each clip begins in the final file.\n\n## Stack\n\nReact + Vite, Tailwind for layout, GSAP + ScrollTrigger for scroll animation,\nThree.js (r128) for depth, Lenis for smooth scroll, Framer Motion for\nmicro-interactions. Desktop-first, 1440px.\n\n## Sections in order\n\nHero -&gt; Figures -&gt; The House (pinned image, scrolling text) -&gt; **Drone reveal\n(mid-scroll)** -&gt; Interiors gallery -&gt; Site &amp; plan -&gt; Enquiry/footer.\n\n## Copy\n\nWrite like a modern architecture listing, not a luxury brochure. Short declarative\nsentences. Every description carries one concrete detail nobody could guess: how the\nconcrete was poured, what the glass is rated for, how far the cantilever reaches.\nDirect and clear. Avoid fluff.\n\n## Animation\n\nScroll-triggered reveals throughout, pinned sections, smooth scroll. Custom cursor.\nHero type and imagery respond subtly to the pointer: parallax offset plus light\ndirection. Interior cards tilt in 3D on hover. Figures count up on enter. Everything\nsnappy and decisive: short durations, slight overshoot. Nothing floats or drifts.\n\n## Drone reveal: the main feature\n\nDedicated pinned section, roughly mid-page. Focus most effort here.\n\nAs the user scrolls in, the video **snaps** from a small framed element\nto full-bleed (fast scale-up, not a gradual grow) then plays its full run of quick\ncuts at natural speed before scroll releases. Video loops, muted, autoplay,\nplaysinline. **Never seek it, never tie playback to scroll position**: scroll\ncontrols the frame around it, never the footage inside it.\n\n**Each cut carries its own information.** Overlay a data card, bottom-left, that\nchanges as the footage moves into each new space:\n\n| Cut | Label | Figure | Line |\n|---|---|---|---|\n| 01 | THE APPROACH | 1.4 ACRES | Private road, no through traffic. |\n| 02 | LIVING VOLUME | 24 FT CEILING | The cantilever hangs 40 feet over open air. |\n| 03 | KITCHEN | 19 FT ISLAND | Single slab, quarried and cut on site. |\n| 04 | PRIMARY SUITE | 900 SQ FT | The glass wall is structural. |\n\nCard layout: a small accent counter (`01 / 04`), the label in wide-tracked caps, the\nfigure in oversized display type, one line beneath. Each card cuts out and the next\ncuts in: hard, fast, no crossfade, matching the energy of the edit.\n\n**Sync mechanism:** drive the card changes from the video&#x27;s own\n`timeupdate` event, switching at the known clip start timestamps. Reading\n`currentTime` works well; never assign to it. Do not drive the cards from scroll\nprogress, because scroll and playback run independently and the text will drift out of sync\nwith the footage.\n\nSplit the overlay headline cleanly above and below the video frame so type never\ncollides with the footage. As the frame expands, the two halves push apart to the\nedges of the viewport. A thin accent line tracks the expansion. Subtle parallax on the\nsurrounding page behind it.\n\n## Deliverable\n\nProduction-ready code, all Higgsfield assets integrated, no placeholder images.\nPrioritize visual impact over everything.\n```\n\n#### Why this prompt works\n- **Assets before code.** The site is designed around real images instead of AI guessing at layout and backfilling. This ordering decision improves overall build quality.\n- **One master asset, everything derived from it.** The six interiors are generated image-to-image from the exterior, not independently. This maintains consistent lighting and style.\n- **Detail is spent unevenly on purpose.** The drone reveal gets a full page of specific direction, while everything else stays concise. Be precise where the main mechanic lives.\n- **Never scrub video with scroll.** Scrubbing video with scroll often breaks these builds. Scroll should control the frame around a video, never the playback position inside it. Reading `currentTime` works fine, but writing to it stutters.\n\n---\n\n## 3. Iteration Prompts\nThe first output is a starting point, and iterating makes the final result stand out.\n\n#### Pass one: parallax\n```text\nAdd a parallax scroll effect to the hero: background moving at a different rate\nto the foreground as you scroll down the page.\n```\nThis single addition helps make the site look polished.\n\n#### Pass two: the construction timelapse\n```text\nAdd a timelapse section showing the estate being built: the structure rising out\nof the ground and the property taking shape.\n\nGenerate the stills with Higgsfield first, each one derived from the previous so the\ncamera position and lighting stay locked. Then build the transitions between them.\nPlay it on scroll-into-view, not scroll-scrubbed.\n```\nTakes roughly four minutes end to end, creating a clean feature for the site.\n\n#### Other iteration prompts worth keeping\n```text\nMake the hero type larger and tighter. Reduce the line height. Increase the\ncontrast between the display and body sizes.\n```\n```text\nThe section transitions are too soft. Make them hard cuts: no fades between\nbackground colours.\n```\n```text\nAdd a custom cursor: a small ring that scales up over interactive elements.\n```\n```text\nOpen the site at 1440px, check it yourself, and fix anything that&#x27;s misaligned,\noverlapping, or trapped below the fold. Report what you found.\n```\nRunning that last prompt helps ensure proper layout alignment across the page.\n\n---\n\n## 4. Build Two: Nacho Macho\nSame workflow, different aesthetic. This shows the workflow works across varied styles.\n\n#### The flavour system\n| # | Name | Colour | Note |\n|---|---|---|---|\n| 01 | Nacho Classico | `#F5A623` | golden, the original |\n| 02 | Chili Lime Slap | `#8FD14F` | lime, sharp, acidic |\n| 03 | Blazing Habanero | `#E23E2F` | hot red, second-chip heat |\n| 04 | Blue Corn Crunch | `#2B5FD9` | electric blue, stone-ground blue corn |\n\nOne colour per flavour. The main design system builds directly from this table.\n\n#### The prompt\n```text\nBuild a fully animated marketing site for NACHO MACHO: a small-batch tortilla chip\nbrand. Tagline: *Loud snack. No apologies.*\n\nGenerate ALL visual assets with the Higgsfield MCP FIRST, then build the site around\nthem. No placeholder images anywhere. Generate the assets, confirm the media IDs, then\nwire everything in.\n\nTone: loud, colourful, high-energy. Chunky display type, hard colour blocking, halftone\nand paper texture, thick black outlines with hard offset shadows: no blur, no soft\nshadows, no gradients between sections. Direct, confident packaging design.\n\n**Important:** the boldness comes from graphic design (colour, type, texture,\ngeometry). Do not use cultural caricature, sombreros, mustaches, or stereotype imagery\nof any kind. The brand focuses strictly on the chips.\n\n## The four flavours\n\n| # | Name | Colour | Note |\n|---|---|---|---|\n| 01 | Nacho Classico | `#F5A623` golden | the original |\n| 02 | Chili Lime Slap | `#8FD14F` lime | sharp, acidic |\n| 03 | Blazing Habanero | `#E23E2F` hot red | second-chip heat |\n| 04 | Blue Corn Crunch | `#2B5FD9` electric blue | stone-ground blue corn |\n\n## Asset generation order (do this first)\n\n1. **The master bag**: a standing foil chip bag, front-facing, studio lit, soft\n   shadow, plain background, Nacho Classico golden colourway. Run background removal.\n   This is the main asset, and everything else comes from it.\n\n2. **Three flavour variants**, generated image-to-image FROM the master bag so the\n   shape, lighting, shadow, and label position stay identical: only the colourway and\n   flavour name change. Lime, hot red, electric blue. Background removal on all three.\n   They should appear as one bag changing flavour.\n\n3. **The chip journey stills**: a single tortilla chip with consistent angle and\n   lighting across all four images. Generate each image-to-image from the first:\n   - plain, unseasoned, pale corn\n   - lightly dusted with seasoning\n   - fully seasoned, heavy red-gold coating\n   - fully seasoned, loaded with dip on one corner\n\n   Background removal on all four.\n\n4. **Seasoning particles**: loose seasoning specks and dust on a plain background,\n   background removed. Include individual chip cutouts at varied angles for\n   scatter elements.\n\n5. **Four ingredient cutouts**: jalape\u00f1o, lime half, corn cob, dried chilli. Same\n   lighting as the chip set, background removed.\n\n6. **A bowl of dip**: thick nacho cheese or salsa in a ceramic bowl, shot from a\n   slight three-quarter angle, background removed.\n\n7. **Two texture plates**: a flat-lay of crushed chips and seasoning from directly\n   above, and an abstract halftone-and-colour field with no objects.\n\n## Stack\n\nReact + Vite, Tailwind for layout, GSAP + ScrollTrigger for scroll animation, Lenis for\nsmooth scroll, Framer Motion for micro-interactions. Desktop-first, 1440px.\n\n**No Three.js and no 3D geometry**: every effect below uses CSS transforms and\nimage swaps.\n\n## Sections in order\n\nHero bag spin -&gt; Chip journey (three linked sections) -&gt; Flavour lineup -&gt; Discount wheel\n-&gt; Footer.\n\n## Copy\n\nShort and direct. Headlines are clear statements. Every flavour description carries one\nconcrete detail: how it&#x27;s fried, where the corn comes from, when the heat arrives.\n\n## Hero: the bag spin\n\nPin the section for roughly 300vh. The bag sits centred and **rotates in place on its\nvertical axis** as the user scrolls without moving position.\n\nMechanism: set up rotation in 2D. Drive `scaleX` from scroll progress so the bag\nsqueezes to zero width at each quarter-turn, then expands back out. **Swap to the next\nflavour image at the exact frame `scaleX` hits zero** to keep the transition smooth.\nThree full rotations across four flavours. Tie everything to `ScrollTrigger` with `scrub`,\nso scrolling backward spins it back and cycles colours in reverse.\n\nAs each flavour lands, the page background changes directly to that flavour&#x27;s colour and the\nflavour name swaps beneath the bag. A counter reads `01 / 04`. Scattered chip and\ningredient cutouts drift behind the bag with parallax depth.\n\n`NACHO MACHO` in large display type, split so the bag sits between the two words:\n`NACHO` behind, `MACHO` in front.\n\n## Chip journey: key section\n\n**One tortilla chip travels through three consecutive sections as a single persistent\nelement.** The chip remains visible throughout. Build it as one fixed-position element\nliving above all three sections, with its transform driven by a single continuous\nScrollTrigger across the full range.\n\nThe chip moves in an arc across the screen (right side, left, then centre)\nrotating slowly as it travels. Text content sits opposite the chip&#x27;s current position.\n\n**Stage 1: Stone-ground.** Chip enters plain and unseasoned, upper right. Copy on\nthe left about the corn.\n\n**Stage 2: Seasoned heavy.** As the chip crosses to the left, seasoning particles\nfall from the top of the viewport toward it, and the chip image transitions from\nplain to lightly dusted to fully seasoned in steps timed to the particles.\nCopy on the right.\n\n**Stage 3: Meet the dip.** The chip travels down to centre while a bowl of dip rises from\nthe bottom of the viewport. The chip tilts, dips into it, and the image swaps to the\nloaded-with-dip version. Hold, then release the pin. Copy above.\n\nAll motion uses `transform` and `opacity` only.\n\n## Flavour lineup\n\nFour cards in a row with black outlines, offset shadows, each angled slightly\nbetween -3 deg and 3 deg. Bag render, flavour name, one line of description, and\na heat rating. Cards tilt toward the cursor on hover.\n\n## Discount wheel\n\nPinned section. A rotating drum holds capsules in the four flavour colours. Scroll\nprogress spins the drum, starting faster and slowing down as the pin ends.\n\nAt the end of the pin, one capsule drops through a chute, lands, and opens to\nshow a discount code in large display type. The page background changes to that\ncapsule&#x27;s flavour colour on the reveal. Beneath it, an email field and a `CLAIM IT`\nbutton compress to `scale(0.96)` on click and bounce back.\n\nBuild the drum, capsules, and chute from CSS shapes and the generated cutouts without using\ncanvas or physics engines. Scroll drives rotation, and the drop runs as a GSAP sequence\nwhen the pin completes.\n\n## Footer\n\nSlow marquee: `NACHO MACHO . LOUD SNACK . NO APOLOGIES .` on a dark background, rotated\n-2 deg. Wordmark, `(c) 2026 Nacho Macho Snack Co.`, three links with an underline effect\non hover.\n\n## Deliverable\n\nProduction-ready code, all Higgsfield assets integrated, no placeholder images.\nPrioritize visual impact over everything.\n```\n\nCheck the four chip stills side by side before building. If the chip&#x27;s shape or angle shifts between stages, the transition will look disconnected. Regenerate from the first still if needed.\n\n---\n\n## 5. The Live-Action Pass\nRun this second prompt after building the site to add real video content.\n\n```text\nAdd one more section to the Nacho Macho site, between the discount wheel and the\nfooter.\n\nThis section uses live-action footage to contrast with the graphic style of the page.\n\n## Generate with the Higgsfield MCP\n\n**One hero video**, Seedance 2.0, 4K, 8 seconds, loop-friendly:\nTwo friends on a couch sharing a bowl of tortilla chips: a hand reaching in, a chip\ndipped, and natural interaction. Warm indoor evening light, handheld feel,\nshallow depth of field. Documentary style with natural lighting and realistic textures.\n\n**Three realistic stills** with matching lighting: a hand reaching into the\nbowl, a close-up of a chip breaking, and a bag opening. Place these as side cards\nflanking the video.\n\nThe Nacho Macho bag should remain visible and clear in the video and at least one still,\nmatching the bag design on the site.\n\n## The section\n\nFull-bleed video, autoplay, muted, loop, playsinline. **Never seek it, never tie\nplayback to scroll position**: scroll controls the frame around it, never the footage\ninside it.\n\nAs the user scrolls in, the video expands from a framed element to full-bleed\nwith a fast scale-up. The three stills sit alongside as small offset cards that\nslide in from the edges on a slight rotation, using black outlines and hard shadows to\nmatch the site style.\n\nOne overlay headline placed cleanly above and below the video frame so text stays clear\nof the footage.\n\nKeep the surrounding background colour and texture consistent with the rest of the page.\n```\n\n---\n\n## 6. The Universal Template\nSwap the placeholders to adapt this layout for other brands.\n\n```text\nBuild a fully animated marketing site for [BRAND NAME]: [ONE-LINE DESCRIPTION OF\nWHAT IT IS AND WHO IT&#x27;S FOR].\n\nGenerate ALL visual assets with the Higgsfield MCP FIRST, then build the site around\nthem. No placeholder images anywhere. Generate the assets, confirm the media IDs, then\nwire everything in.\n\nTone: [THREE ADJECTIVES]. Think [REFERENCE CATEGORY: e.g. \&quot;a modern design magazine\&quot;,\n\&quot;packaging aisle\&quot;, \&quot;an auction catalogue\&quot;], not [WHAT IT SHOULD NOT FEEL LIKE].\n[TYPOGRAPHY DIRECTION]. [COLOUR DIRECTION]. Explicitly avoid: [BANNED VISUAL CLICHES\nFOR THIS CATEGORY].\n\n## Asset generation order (do this first)\n\n1. **The master asset**: [THE MAIN IMAGE: product, building, or space. Describe lighting, angle, background, and mood clearly.]\n   This is the main asset, and everything else comes from it.\n\n2. **[N] variants**, generated image-to-image FROM the master so [WHAT STAYS\n   IDENTICAL: lighting, angle, shape, grade] match exactly: only [WHAT CHANGES]\n   changes. [LIST THEM].\n\n3. **[SUPPORTING STILLS]**: [WHAT THEY ARE AND HOW MANY]. Same lighting language\n   across the set.\n\n4. **[CUTOUT ELEMENTS]**: [WHAT THEY ARE], on clean backgrounds, with background\n   removal.\n\n5. **[VIDEO, IF ANY]**: Seedance 2.0, 4K, [N] clips of [DURATION] each,\n   colour-matched to the master. [DESCRIBE EACH CLIP IN ONE LINE.] [CAMERA ENERGY:\n   fast and decisive, or slow and floating.] Combine into one file.\n\n## Stack\n\nReact + Vite, Tailwind for layout, GSAP + ScrollTrigger for scroll animation, Lenis\nfor smooth scroll, Framer Motion for micro-interactions. Desktop-first, 1440px.\n[ADD Three.js r128 ONLY IF YOU NEED 3D.]\n\n## Sections in order\n\n[SECTION 1] -&gt; [SECTION 2] -&gt; **[SHOWPIECE SECTION]** -&gt; [SECTION 4] -&gt; [SECTION 5] -&gt;\nfooter.\n\n## Copy\n\nWrite like [WHO THE VOICE BELONGS TO]. [SENTENCE STRUCTURE RULE: e.g. \&quot;short\ndeclarative sentences\&quot;]. Every description carries one concrete detail: [EXAMPLES OF DETAILS]. Avoid: [3-5 BANNED WORDS FOR THIS CATEGORY].\n\n## Animation\n\nScroll-triggered reveals throughout, pinned sections, smooth scroll. Custom cursor.\n[HOW ELEMENTS RESPOND TO POINTER]. [HOVER BEHAVIOUR]. Everything [SNAPPY AND DECISIVE / SLOW AND FLOATING].\n\n## [SHOWPIECE NAME]: the main feature\n\nDedicated pinned section, roughly [WHERE ON THE PAGE]. Focus most effort here.\n\n[DESCRIBE THE MECHANIC: specify what pins, what moves, what drives it, what changes, and initial/final states.]\n\n[IF IT INVOLVES VIDEO: Video loops, muted, autoplay, playsinline. Never seek it, never\ntie playback to scroll position: scroll controls the frame around it, never the\nfootage inside it.]\n\n[IF TEXT SYNCS TO SOMETHING: state exactly what drives the sync.]\n\n## Deliverable\n\nProduction-ready code, all Higgsfield assets integrated, no placeholder images.\nPrioritize visual impact over everything.\n```\n\n#### Guidance\n- **The master asset is central.** Spend time refining it, as other images inherit its lighting and style.\n- **Pick one main feature.** Focus detailed mechanical instructions on one primary showpiece section to keep the page layout clean.\n- **Banned words improve copy.** Setting clear negative constraints on overused words keeps the tone natural.\n- **Specify models directly.** Use explicit settings like Seedance 2.0, 4K, and exact clip lengths for clearer outputs.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/build-10-000-websites-with-ai&quot;,&quot;rel_md_path&quot;:&quot;Guides/build-10-000-websites-with-ai.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;build-3-ai-agents-in-base44&quot;,&quot;slug&quot;:&quot;build-3-ai-agents-in-base44&quot;,&quot;name&quot;:&quot;Build 3 AI Agents in Base44 \u2014 Complete Prompt Pack&quot;,&quot;description&quot;:&quot;A complete prompt pack and setup guide for building 3 AI superagents (Inbox, Publisher, Analyst) in Base44.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Skool&quot;,&quot;Community&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;## Before You Start\n\n- **Sign up / Log in:** [Base44 Superagents](https://base44.com/superagents)\n  *(Prompts below ready to use. Swap bracketed parts for your own details.)*\n- **Required Accounts:** Free/trial accounts for tools to connect:\n  - **Vesper (Inbox):** Gmail, Google Calendar, WhatsApp (optional)\n  - **Publisher:** LinkedIn, X\n  - **Analyst:** CRM (HubSpot, etc.), Google Analytics, Slack\n\n&gt; [!TIP]\n&gt; You don&#x27;t need all tools right away. Build the Inbox Agent first with Gmail, which takes about two minutes. The rest follow the same process.\n\n#### Standard Setup\n\n1. Name the agent\n2. Write the identity under \&quot;About the agent\&quot;\n3. Fill in Memory (your background details)\n4. Connect plugins\n5. Enter the job prompt\n6. Set permissions and select the model\n7. Configure automation\n\n---\n\n## Agent 1: Vesper (Inbox Triage)\n\n**Difficulty:** Beginner | **Build Time:** ~2 minutes\n\n#### Step 1: Name\n`Vesper`\n\n#### Step 2: About the Agent (Identity Box)\n```text\nYou&#x27;re not a chatbot and you&#x27;re not an assistant. You work directly with me to handle routine tasks and answer questions clearly.\n\nYou remain calm and focused. You handle administrative work without needing constant reminders. When something genuinely needs my attention, state it plainly and explain why without unnecessary background context.\n\nFocus on being practical and direct.\n```\n\n#### Step 3: Memory Tab\n- **My name:** `[Your first name]`\n- **About me:** `I run [what you do: e.g. a YouTube channel about AI automation, plus a small consulting side].`\n- **What I care about:** `[e.g. shipping fast, keeping admin low, keeping mornings free for creative work].`\n- **What I&#x27;m working on right now:** `[current project].`\n- **What annoys me:** `[e.g. long emails that hide the core request, unnecessary CCs, re-explaining context].`\n- **How I write:** `[e.g. short sentences, direct language, friendly tone. Avoid corporate jargon like \&quot;just circling back\&quot;].`\n- **My working hours:** `[e.g. 9am-6pm GMT, no meetings on Fridays].`\n\n*(Leave \&quot;Things the agent has learned about you\&quot; alone: it updates automatically).*\n\n#### Step 4: Plugins\n- Gmail\n- Google Calendar\n\n#### Step 5: Job Prompt\n```text\nHere&#x27;s your job.\n\nRead incoming emails. Draft replies for routine messages. Flag items that require my direct input and explain why. If a message requests a meeting, check my calendar before responding.\n\nRules:\n- Save replies as drafts only. Do not send messages automatically.\n- Follow the communication style defined in Memory: short, direct, and concise.\n- If someone requests a meeting, check the calendar first and offer two or three open timeslots.\n- Group newsletters, receipts, and system notifications at the bottom of the summary as a total count.\n- When flagging an item, include one line explaining specifically why it needs my attention.\n\nFormat your summary like this:\nNEEDS ATTENTION (with a one-line explanation for each)\nDRAFTED (subject line + recipient)\nFILTERED (total count by category)\n```\n\n#### Step 6: Set Permissions\n&gt; [!WARNING]\n&gt; Go to **Settings -&gt; Security -&gt; Agent Permissions**:\n&gt; - **Update data:** OFF\n&gt; - **Delete data:** OFF\n&gt; \n&gt; Check these settings before linking accounts.\n\n- Ensure **Auto-detect secrets** is ON to store API keys securely.\n\n#### Step 7: Send to WhatsApp\n1. Go to **Customize -&gt; Channels -&gt; Connect**\n2. Scan the QR code and confirm the link.\n3. Add this instruction:\n   ```text\n   Send the inbox summary to WhatsApp instead of keeping it in chat. Keep the summary under ten lines so it remains easy to read on a mobile screen.\n   ```\n\n#### Step 8: Automate\n```text\nRun this every weekday at 8:00am. Triage incoming messages received since the last run, create draft replies where appropriate, and send the summary via WhatsApp.\n```\n\n---\n\n## Agent 2: The Publisher (LinkedIn + X)\n\n**Difficulty:** Intermediate | **Build Time:** ~5 minutes\n\n#### Step 1: Name\n`[Your name]&#x27;s Publisher`\n\n#### Step 2: About the Agent (Identity Box)\n```text\nYou write posts matching my personal style and voice.\n\nUse clear, direct phrasing and short sentences. Provide specific real-world examples rather than general statements, and start each post with a clear main point.\n\nGuidelines:\n- Avoid buzzwords, generic intros, or unnecessary filler phrases.\n- Avoid repetitive short lines created purely for emphasis.\n- Do not invent fictional stories, metrics, or client examples. Ask for details if an example is needed.\n- Focus on one key concept per post.\n\nKeep content clear, specific, and practical.\n```\n\n#### Step 3: Memory Tab\n- **I post about:** `[your topics]`\n- **My audience:** `[who they are, their experience level, their main goals]`\n- **My voice:** `[3-4 lines describing your communication style]`\n- **Words and phrases I never use:** `[list specific words to avoid]`\n- **Posts of mine that performed well:** `[paste 2-3 previous top-performing posts]`\n\n&gt; [!IMPORTANT]\n&gt; Include actual past posts. This helps establish the writing style more accurately than general descriptions.\n\n#### Step 4: Plugins\n- LinkedIn\n- X (Twitter)\n\n#### Step 5: Job Prompt\n```text\nHere&#x27;s your job.\n\nTake a single topic and prepare separate versions for LinkedIn and X.\n\nLinkedIn (longer version):\n- Place the core message in the opening line.\n- Use 150-300 words with short paragraphs.\n- Include one specific example or data point.\n- End with a practical key takeaway.\n\nX (short version):\n- Stay under 280 characters, or use a short thread if necessary.\n- Focus the message in the opening line.\n- Do not include hashtags.\n\nShow both versions for review before scheduling. Once approved, schedule the posts.\n```\n\n#### Step 6: Memory Scope\nGo to **Sharing and Access -&gt; Memory**:\n- **No memory:** Starts each chat with no saved context.\n- **Separated:** Retains context within individual conversations while keeping them isolated.\n- **Shared:** Shares learned details across all conversations.\n\n&gt; Use **Shared** for a single brand, or **Separated** when managing distinct accounts.\n\n#### Step 7: Automate\n```text\nEvery Monday at 9am, request topic ideas for the week. Once an idea is provided, draft versions for both platforms and hold them for review. Schedule approved content for Tuesday and Thursday at 8am.\n```\n\n---\n\n## Agent 3: The Analyst\n\n**Difficulty:** Advanced | **Build Time:** ~10 minutes\n\n#### Step 1: Name\n`The Analyst`\n\n#### Step 2: About the Agent (Identity Box)\n```text\nYou monitor site metrics and business data, reporting changes clearly.\n\nState metric drops or performance changes directly at the beginning of the report.\n\nFocus on significant shifts in data rather than routine numbers. If traffic dropped, state the percentage decrease and the underlying cause directly.\n\nDistinguish clearly between confirmed data points and analytical assumptions. Present verified metrics as facts, and label interpretations clearly as hypotheses.\n\nIf metrics remain steady, state that no significant changes occurred rather than generating unnecessary commentary.\n```\n\n#### Step 3: Memory Tab\n- **My business:** `[your products or services, target market]`\n- **Key metrics:** `[e.g. email signups, qualified leads, conversion rates]`\n- **Baseline numbers:** `[e.g. 800-1200 daily sessions, 15-25 signups/week]`\n- **Funnel stages:** `[e.g. Lead -&gt; Discovery Call -&gt; Proposal -&gt; Closed]`\n- **Known bottlenecks:** `[e.g. lead drop-off at the proposal stage]`\n\n#### Step 4: Plugins\n- Google Analytics\n- CRM (HubSpot, etc.)\n- Slack *(Setup: Custom -&gt; Channels -&gt; Select channel)*\n\n#### Step 5: Job Prompt\n```text\nHere&#x27;s your job.\n\nCheck daily traffic against the previous month and identify notable changes in traffic sources. Check the CRM pipeline to track how leads progress through each stage.\n\nGuidelines:\n- Compare performance against the same period last month and the same day last week.\n- Flag metric variations larger than 15%.\n- For CRM tracking: report lead counts by stage and flag items inactive for over 7 days.\n- If a traffic channel declines, identify the specific pages or campaigns driving the drop.\n- Clearly separate confirmed metrics from analytical estimates.\n\nReport structure:\nNOTABLE CHANGES (largest shifts listed first)\nTRAFFIC SUMMARY (sources compared against monthly and weekly benchmarks)\nPIPELINE STATUS (stage counts and inactive leads)\nANALYSIS (clearly marked as hypothesis)\n```\n\n#### Step 6: Model Configuration\n&gt; [!IMPORTANT]\n&gt; Go to **Settings -&gt; General**:\n&gt; - **Chat model:** Handles interactive sessions.\n&gt; - **Automation model:** Handles scheduled background runs.\n&gt;\n&gt; Select a high-capability model for the **Automation model** to support automated data analysis.\n\n#### Step 7: Automate\n```text\nRun this check every weekday at 8am and post the summary to the specified Slack channel. If no metrics cross the 15% threshold and the pipeline remains active, post a brief status update with current traffic numbers.\n```\n\n---\n\n## Ship It: Share Your Agents\n\n- Go to **Sharing -&gt; Public Template Link**.\n- Connected accounts and API keys do not transfer with template links.\n\n---\n\n## Quick Reference Table\n\n| Setting | Location | Recommendation |\n| :--- | :--- | :--- |\n| **Update/Delete data** | Settings -&gt; Security -&gt; Agent Permissions | `OFF` for routine agents |\n| **Auto-detect secrets** | Settings -&gt; Security | `ON` |\n| **Memory scope** | Sharing and Access -&gt; Memory | `Shared` (single brand) / `Separated` (multiple brands) |\n| **Model Selection** | Settings -&gt; General | Use high-capacity model for background tasks |\n| **WhatsApp delivery** | Customize -&gt; Channels | Scan QR code to pair device |\n| **Slack delivery** | Plugins -&gt; Custom -&gt; Channels | Select target channel |\n| **Public sharing** | Sharing -&gt; Public Template Link | Creates template link without credentials |\n\n---\n\n## Troubleshooting\n\n- **\&quot;My replies sound artificial.\&quot;**\n  - Provide additional reference examples in Memory to better reflect your writing style.\n- **\&quot;The agent flags minor details.\&quot;**\n  - Add strict threshold instructions: `Flag only the top 3 high-priority items per run.`\n- **\&quot;The background task does not update data.\&quot;**\n  - Verify that `Update data` permissions are enabled if the action explicitly requires writing changes.\n- **\&quot;The agent reports estimated data as fact.\&quot;**\n  - Add explicit constraints in the identity settings: `State clearly when data is missing, and avoid guessing unmeasured numbers.`&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/build-3-ai-agents-in-base44&quot;,&quot;rel_md_path&quot;:&quot;Guides/build-3-ai-agents-in-base44.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;build-a-self-updating-llm-knowledge-base&quot;,&quot;slug&quot;:&quot;build-a-self-updating-llm-knowledge-base&quot;,&quot;name&quot;:&quot;Build a Self-Updating LLM Knowledge Base&quot;,&quot;description&quot;:&quot;Blog post on building a self-updating LLM knowledge base&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;LLM&quot;,&quot;Knowledge Base&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;https://bholmes.dev/blog/llm-knowledge-bases/&quot;,&quot;content&quot;:&quot;&quot;,&quot;is_shallow&quot;:true,&quot;path&quot;:&quot;/items/guides/build-a-self-updating-llm-knowledge-base&quot;,&quot;rel_md_path&quot;:&quot;Guides/build-a-self-updating-llm-knowledge-base.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;build-an-award-worthy-f1-landing-page&quot;,&quot;slug&quot;:&quot;build-an-award-worthy-f1-landing-page&quot;,&quot;name&quot;:&quot;Build an Award-Worthy F1 Landing Page&quot;,&quot;description&quot;:&quot;Step-by-step instructions for using AI Web Builder and AI Media Generator to scaffold a premium Formula 1 landing page with cinematic visuals.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Skool&quot;,&quot;Community&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;## Step 1 \u2014 Build the Landing Page in AI Web Builder\n\nOpen your AI Web Builder and paste the prompt below. It will scaffold the entire site \u2014 hero section, gallery, animations, responsive design \u2014 all in about two minutes.\n\n#### Prompt #1 \u2014 Initial Landing Page Build:\n&gt; Create a premium landing page for Formula 1 driver Lewis Hamilton. Include a full-screen hero section with space for a background video element and bold headline text overlay. Add a gallery/showcase section, a stats section with career highlights, a quote section, and a call-to-action section. Use a dark color scheme with racing-inspired accents. Typography should be clean and modern. All sections should have smooth scroll-triggered animations. Make it fully responsive.\n\nPreview the result. The layout will be solid, but the visuals will still look generic. That&#x27;s what we fix next.\n\n---\n\n## Step 2 \u2014 Generate Premium Visuals in AI Media Generator\n\nThis is what separates a template from a professional site. AI Media Generator has two tools we&#x27;ll use:\n* **Cinema Studio** \u2014 for 360\u00b0 camera movements (like a car reveal)\n* **Road Rush model** \u2014 trained specifically on racing footage\n\n#### Cinema Studio \u2014 Hero Shot\n#### Prompt #2 \u2014 360\u00b0 Car Shot:\n&gt; Dramatic 360-degree rotation around a Formula 1 car, studio lighting, dark background, cinematic, high detail\n\n#### Gallery Images\n#### Prompt #3 \u2014 Helmet Close-Up:\n&gt; Close-up of an F1 racing helmet, dramatic studio lighting, dark background, sharp detail, cinematic\n\n#### Prompt #4 \u2014 Steering Wheel POV:\n&gt; F1 steering wheel from driver&#x27;s POV, cockpit view, carbon fiber detail, professional lighting\n\n#### Prompt #5 \u2014 Wide Track Shot:\n&gt; Wide shot of a Formula 1 car on track, motion blur background, golden hour lighting, cinematic composition\n\n#### Road Rush \u2014 Dynamic Racing Video\n#### Prompt #6 \u2014 Racing Video:\n&gt; Dynamic footage of a Formula 1 car at high speed, low camera angle, aggressive motion blur, camera tracking the car, broadcast-quality racing shot\n\n---\n\n## Step 3 \u2014 Convert Video to Frames\n\nAI Web Builder can&#x27;t process video directly, so we convert it to image frames:\n1. Go to an online video converter (e.g., ezgif.com)\n2. Select **Video to JPG**\n3. Upload your hero video\n4. Download the folder of sequential JPG frames\n\n---\n\n## Step 4 \u2014 Add Visuals to the Website\n\nUpload your generated AI assets into the AI Web Builder (create a folder called `\&quot;assets\&quot;`), then use this prompt:\n\n#### Prompt #7 \u2014 Integrating Visuals:\n&gt; Integrate the uploaded assets into the website. Use the hero-frames folder as a background video sequence in the hero section with text overlay. Place the gallery images in a three-column grid layout with hover effects. Ensure the hero text has enough contrast to be readable over the video.\n\n---\n\n## Step 5 \u2014 Iterate and Polish\n\nThis is where you go from \&quot;good enough\&quot; to award-worthy. Use these prompts one at a time:\n\n#### Prompt #8 \u2014 Typography Change:\n&gt; Change the headline fonts to a bolder, more angular typeface that communicates speed and aggression. Think racing brand typography \u2014 punchy, not safe.\n\n#### Prompt #9 \u2014 Hover Effects:\n&gt; Update the gallery card hover effects. Instead of a basic scale-up, add a smooth lift animation where the card rises with a soft drop shadow, like it&#x27;s accelerating off the page. Make the transition smooth and premium-feeling.\n\n#### Prompt #10 \u2014 Dark/Light Mode Toggle:\n&gt; Add a dark and light mode toggle to the website. Dark mode should feel edgy and sporty with deep blacks, fitting the F1 aesthetic. Light mode should use a cream background for a softer but still sporty look. The transition between modes should be fluid, not abrupt. Include a toggle button in the header.\n\n#### Prompt #11 \u2014 CTA Button Glow:\n&gt; Add a subtle glow effect to the main call-to-action button and make the hover transition faster. It should feel urgent, like you&#x27;re about to hit the throttle.\n\n---\n\n## Step 6 \u2014 Deploy with GitHub + Netlify\n\n1. In your AI Web Builder, click **Publish to GitHub** \u2014 it creates a repo and pushes your code.\n2. Go to **Netlify** \u2192 connect your GitHub account.\n3. Select the repository \u2192 click **Deploy**.\n4. Netlify builds, optimizes, sets up CDN + SSL (~40 seconds).\n5. Your site is live with a URL.\n\nTo update: make changes in AI Web Builder \u2192 push to GitHub \u2192 Netlify auto-redeploys. No FTP, no cPanel.\n\n&gt; **Note:** This workflow works for any niche \u2014 luxury brands, fitness, tech startups. Swap the visuals and prompts for your niche and follow the same framework.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/build-an-award-worthy-f1-landing-page&quot;,&quot;rel_md_path&quot;:&quot;Guides/build-an-award-worthy-f1-landing-page.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;build-insane-animated-websites&quot;,&quot;slug&quot;:&quot;build-insane-animated-websites&quot;,&quot;name&quot;:&quot;Build Insane Animated Websites \u2014 Full Setup Guide&quot;,&quot;description&quot;:&quot;A full setup guide for connecting Higgsfield MCP to your AI to generate custom visual assets and iterative feedback for animated websites.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Skool&quot;,&quot;Community&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;## Setup \u2014 Connect Higgsfield MCP to AI\n\n1. Sign up at Higgsfield AI (`https://higgsfield.ai/mcp`).\n2. Copy MCP URL.\n3. In settings, add custom connector and paste URL.\n4. Complete quick auth flow.\n5. All image/video models accessible directly (Nano Banana Pro for images, Seedance 2.0 for 4K video).\n\n## Core Principle\n\n**Generate visual assets first. Build site around them.**\nAvoid placeholder images. Generating real assets first establishes exact dimensions, color palette, and visual weight.\n\n## Iterative Feedback Loop\n\nFirst render rarely final. Give specific, sequential feedback:\n- Logo on two lines -&gt; Make logo single line.\n- Can angle wrong -&gt; Face can directly to camera.\n- Color transitions rough -&gt; Improve flavor scroll transition.\n\n---\n\n## Build 1 \u2014 RISE Hydration Drink\n\n#### Overview\nAnimated marketing site for premium hydration drink brand.\n\n#### Tech Stack\n- Single-page site: React, Vite, Tailwind CSS\n- GSAP + ScrollTrigger (scroll animation)\n- Three.js (r128 for 3D elements)\n- Lenis (smooth scroll)\n- Framer Motion (micro-interactions)\n\n#### Section Layout\n1. Hero\n2. Product Showcase\n3. Seedance Video Reveal (Mid-scroll)\n4. Ingredients / Benefits\n5. Hydration Science\n6. Flavor Spin Section\n7. CTA / Footer\n\n#### Flavor Variants\n- Berry (Red)\n- Lime / Citrus (Green)\n- Mango / Citrus (Orange)\n- Blue Raspberry / Electrolyte (Blue)\n\n#### Asset Generation Workflow\n1. Berry cluster hero image.\n2. Master hero can: sleek look, condensation, studio lighting, gradient backdrop.\n3. 4 flavor variants: image-to-image from master can (identical lighting/framing, distinct color identity).\n4. Ingredient/particle imagery (electrolytes, fruit, water splashes) with background removed.\n5. Abstract liquid and gradient background textures.\n6. Cinematic hero video (Seedance 2.0 at 4K): slow-motion can with water burst, color-matched, loopable.\n\n#### Key Animations\n- **3D Scroll:** Can rotates, tilts, and translates through scene on scroll with parallax background layers.\n- **Mouse Tracking:** Hero elements and 3D can subtly track cursor position; custom animated cursor.\n- **Interactive Particles:** Water droplets and ingredient particles react to cursor hover/proximity.\n- **Flavor Spin Section:** Pinned section where scrolling spins can on vertical axis and morphs flavor color sequentially (Red -&gt; Green -&gt; Orange -&gt; Blue). Can color crossfades at each turn, syncing background accent and text labels.\n- **Mid-Scroll Video Reveal:** Video framed element scales/fades to full-bleed on scroll entry, plays splash animation, then releases scroll. Headline text split cleanly above and below video frame.\n\n#### Product Ad &amp; Pre-Flight Check\n1. Generate video of person drinking product, holding product toward camera with locked flavor identity.\n2. Run clip through Virality Predictor to evaluate hook strength, attention curve, and retention risk.\n3. Place video near page end, immediately before final CTA.\n\n#### Deployment\nDeploy to production via Vercel.\n\n---\n\n## Build 2 \u2014 Zinho Automates\n\n#### Overview\nScrollytelling interactive narrative covering the origin story of an AI automation YouTube creator (@zinhoautomates).\n\n#### Tech Stack\n- React, Vite, Tailwind CSS\n- GSAP + ScrollTrigger (scrubbed, pinned scenes)\n- Lenis (smooth scroll)\n- Framer Motion (micro-interactions)\n- Three.js (r128) for depth elements\n\n#### Rules for Personal Assets\n- User photo stored locally in `public/` directory, used as static asset.\n- Never run personal photo through generative image/video models.\n- Generative tools build surrounding background, node convergence, particle halo, and world context.\n\n#### Story Scenes\n1. **Cold Open:** Dark screen, single pulsing glowing node, typing terminal text. Cursor tracking adds micro-motion.\n2. **The Spark:** Node branches into connected automation graph on scroll.\n3. **Building in Public:** Graph morphs into YouTube play button shape composed of nodes. Stat counters increment on scroll (45K+ subscribers, 16K+ community members). Topic tags fly into view.\n4. **The Stack:** Horizontal conveyor displaying core tool/theme cards lighting up sequentially.\n5. **The Community:** Nodes multiply into interactive constellation representing community members; points react to cursor proximity.\n6. **The Reveal (The Mission):** Abstract avatar dissolves into actual user photo. Surrounding nodes and energy lines converge toward photo, forming ambient halo. Seedance 4K video plays full-bleed in background.\n7. **Invitation / CTA:** Animated logo mark resolves with ambient particle backdrop. Links to YouTube channel and community.\n\n#### Design Language\n- Dark background with glowing neon accents.\n- Scrubbed, reversible scroll progress tied to GSAP ScrollTrigger.\n- Custom animated cursor and interactive ambient particle node system.\n\n---\n\n## Generic Template System\n\n#### Universal Workflow Rules\n- Build fully animated site around pre-generated visual assets.\n- Stack: React, Vite, Tailwind CSS, GSAP + ScrollTrigger, Three.js (r128), Lenis, Framer Motion.\n- Real personal photos kept intact without generative modifications; environment built around photo.\n\n#### Variant Structure\n- **Product / Brand Site:** Hero -&gt; Product Showcase -&gt; Video Reveal -&gt; Features -&gt; Story/Science -&gt; Interactive Product Spin/Morph -&gt; CTA.\n- **Personal / Portfolio / Story Site:** Guided interactive documentary scroll through sequential pinned scenes (Cold Open -&gt; Origin -&gt; Stats -&gt; Work/Stack -&gt; Community -&gt; Photo Reveal -&gt; CTA).&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/build-insane-animated-websites&quot;,&quot;rel_md_path&quot;:&quot;Guides/build-insane-animated-websites.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;how-to-access-multiple-free-ai-models-at-once&quot;,&quot;slug&quot;:&quot;how-to-access-multiple-free-ai-models-at-once&quot;,&quot;name&quot;:&quot;How to Access Multiple Free AI Models at Once&quot;,&quot;description&quot;:&quot;Make Community walkthrough of accessing multiple free AI models&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;AI Models&quot;,&quot;Workflow Automation&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;https://community.make.com/t/how-to-access-multiple-free-ai-models-at-once/40751&quot;,&quot;content&quot;:&quot;&quot;,&quot;is_shallow&quot;:true,&quot;path&quot;:&quot;/items/guides/how-to-access-multiple-free-ai-models-at-once&quot;,&quot;rel_md_path&quot;:&quot;Guides/how-to-access-multiple-free-ai-models-at-once.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;how-to-build-a-10k-month-app-in-2026&quot;,&quot;slug&quot;:&quot;how-to-build-a-10k-month-app-in-2026&quot;,&quot;name&quot;:&quot;How to Build a $10k/Month App in 2026&quot;,&quot;description&quot;:&quot;A 60-second blueprint on building and launching a profitable app, from idea generation to deployment and marketing.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Software Engineering&quot;,&quot;Business&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;#### 1. Idea Generation\n- Stop obsessing over a completely unique idea.\n- Use **Sensor Tower** or **Trust MRR** to find apps already generating real revenue.\n- Find ways to tweak or improve them to create your own version.\n\n#### 2. Choose Your Stack\n- **Web App**: Use **Next.js** for seamless front-end and back-end development.\n- **Mobile App**: Use **React Native** and **Expo Go** to build for both Apple and Android simultaneously.\n\n#### 3. Leverage AI Tools\n- Familiarize yourself with AI coding assistants.\n- **Claude Coder**: Best for front-end design and user experience.\n- **Codex**: Best for complex backend architecture.\n\n#### 4. Backend &amp; Payments\n- **Database / Backend**: Supabase or Firebase.\n- **Payments**: Stripe (Web) or RevenueCat (Mobile).\n\n#### 5. Launch &amp; Distribute\n- Release early to get user feedback immediately.\n- **Deployment**: Vercel (free for web), App Store ($99/yr), Play Store ($25/yr).\n- **Marketing**: Grow organically through TikTok, Instagram, UGC, Reddit, or Product Hunt.\n- **Scale**: Once organic works, turn the winning formulas into paid ads.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/how-to-build-a-10k-month-app-in-2026&quot;,&quot;rel_md_path&quot;:&quot;Guides/how-to-build-a-10k-month-app-in-2026.md&quot;}"></div>

<div class="js-card-render" data-item="{&quot;id&quot;:&quot;hubspot-cold-email-generator-ai&quot;,&quot;slug&quot;:&quot;hubspot-cold-email-generator-ai&quot;,&quot;name&quot;:&quot;How to Create a Personalized Cold Email Generator Using AI&quot;,&quot;description&quot;:&quot;A guide by HubSpot on creating personalized cold email generators using AI.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Email&quot;,&quot;Sales&quot;],&quot;url&quot;:&quot;https://53.fs1.hubspotusercontent-na1.net/hubfs/53/How%20to%20Create%20a%20Personalized%20Cold%20Email%20Generator%20Using%20AI%20Guide.pdf?hubs_signup-url=offers.hubspot.com/cold-email-using-ai&amp;hubs_signup-cta=submit&amp;hubs_offer=offers.hubspot.com/cold-email-using-ai&quot;,&quot;content&quot;:&quot;&quot;,&quot;is_shallow&quot;:true,&quot;path&quot;:&quot;/items/guides/hubspot-cold-email-generator-ai&quot;,&quot;rel_md_path&quot;:&quot;Guides/hubspot-cold-email-generator-ai.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;how-to-find-a-tech-job-in-2026&quot;,&quot;slug&quot;:&quot;how-to-find-a-tech-job-in-2026&quot;,&quot;name&quot;:&quot;How to Find a Tech Job in 2026&quot;,&quot;description&quot;:&quot;A concise blueprint for breaking into tech and landing a software engineering job in a competitive market.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Career&quot;,&quot;Coding&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;#### 1. Master LeetCode\n- Start practicing daily well before the recruiting cycle begins.\n- If you don&#x27;t know where to start, focus on the **Blind 75** list on LeetCode.\n\n#### 2. Learn a High-Demand Skill\n- If your resume isn&#x27;t getting bites, you need new skills.\n- Dive deep into **AWS** (via AWS Skill Builder) or **Spring Boot**.\n- Recommended resource: *Amigoscode* on YouTube.\n\n#### 3. Build Something Valuable\n- Classes and degrees are no longer enough.\n- Build a significant project that takes at least 3-6 weeks to complete to showcase on your resume.\n\n#### 4. Network Relentlessly\n- \&quot;It&#x27;s not what you know, it&#x27;s who you know.\&quot;\n- Attend career fairs and hackathons.\n- Message your connections directly when applying for jobs; referrals are the easiest way to get an interview.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/how-to-find-a-tech-job-in-2026&quot;,&quot;rel_md_path&quot;:&quot;Guides/how-to-find-a-tech-job-in-2026.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;build-5k-month-ai-websites&quot;,&quot;slug&quot;:&quot;build-5k-month-ai-websites&quot;,&quot;name&quot;:&quot;How to Sell $5,000/Month AI Websites&quot;,&quot;description&quot;:&quot;A complete workflow for building high-ticket, automated AI websites for local businesses using GoHighLevel and AI tools.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Web Design&quot;,&quot;Workflow Automation&quot;,&quot;Business&quot;,&quot;Sales&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;Stop selling basic $300 websites generated by ChatGPT. To charge high-ticket retainers ($3k-$5k/month), you must sell **systems**, not just sites. This means integrating CRMs, automated follow-ups, and AI booking tools.\n\n#### Step 1: Scrape Competitor Formats\n- Go to the **Facebook Ad Library** and find competitors in your niche (e.g., bathroom remodeling) that are running ads.\n- If they are running ads, their website converts.\n- Copy their URL and use **Firecrawl** to scrape the site for its `markdown` (structure) and `branding` (colors).\n\n#### Step 2: Generate the Foundation\n- Find your target client&#x27;s existing (outdated) website and scrape their logo/branding.\n- Paste the competitor&#x27;s markdown + your client&#x27;s branding into **Claude AI** or the **GoHighLevel AI Studio**.\n- Prompt: *\&quot;Make me a website similar to this structure, optimized for cold traffic conversions, using this new branding.\&quot;*\n\n#### Step 3: Create Authentic UGC Images with AI\n- Don&#x27;t use obvious AI-generated images or stock photos.\n- Go to **Pinterest**, search for organic UGC (User Generated Content) style photos in the niche.\n- Use tools like **Hixfield**, **Nano Banana Pro**, or **Midjourney** as an image-to-image generator.\n- Prompt: *\&quot;Generate an image of a modern bathroom, UGC iPhone style picture, using the layout of the reference photo.\&quot;*\n- You can even generate perfect \&quot;Before &amp; After\&quot; split-screen photos using AI.\n\n#### Step 4: Add Backend Automation (The $5k Value)\n- Build the site inside **GoHighLevel** so it natively connects to a CRM.\n- **Automated Follow-ups**: When a lead fills a form, immediately trigger an SMS (\&quot;Hey, got your request, calling in 5 mins!\&quot;).\n- **Reactivation Campaigns**: If a lead goes cold, automate an email/SMS 60 days later to revive them.\n- **Booking &amp; Payments**: Allow customers to book calendar slots and pay directly on the site.\n\n#### Step 5: Sales\n- Cold call, DM, or SMS local businesses.\n- Send them a preview link of the completed AI website (built in 10 minutes) before they even pay. \n- Upsell them on the backend automation and ad-management.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/build-5k-month-ai-websites&quot;,&quot;rel_md_path&quot;:&quot;Guides/build-5k-month-ai-websites.md&quot;}"></div>

<div class="js-card-render" data-item="{&quot;id&quot;:&quot;motion-graphics-in-ai&quot;,&quot;slug&quot;:&quot;motion-graphics-in-ai&quot;,&quot;name&quot;:&quot;Motion Graphics with AI \u2014 Full Setup &amp; Workflow Guide&quot;,&quot;description&quot;:&quot;A 3-step workflow for creating custom, high-quality motion graphics directly inside your AI workspace using an MCP connector.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Skool&quot;,&quot;Community&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;Create custom, high-quality motion graphics directly inside your AI workspace using an MCP connector and structured prompt templates.\n\n---\n\n## Quick Start\n\n#### What You Need\n- **Higgsfield AI Account:** Sign up on their site.\n- **AI Tool / Coding Assistant:** Fitted with custom Higgsfield MCP connector.\n\n#### 3-Step Workflow\n1. **Generate Prompt:** Describe style and topic to main AI Chat.\n2. **Build with AI Coding Assistant:** Paste prompt into AI Coding Assistant. Tell it \&quot;Build it\&quot;.\n3. **Save Output:** Get final video folder.\n\n---\n\n## Part 1: One-Time Setup\n\n1. Make account on Higgsfield.\n2. Copy custom MCP URL inside Higgsfield.\n3. Open AI Settings $\\rightarrow$ Customize $\\rightarrow$ Add Custom Connector $\\rightarrow$ paste MCP URL.\n4. Finish simple auth flow.\n\nMCP setup done. Image and video models now ready inside AI Coding Assistant.\n\n---\n\n## Part 2: Prompt Generator (AI Chat Template)\n\nUse template inside main AI Chat. Fill in brackets to make prompt for AI Coding Assistant.\n\n#### Master Prompt Generator\n\n```text\nYou are writing a single, self-contained build prompt that I will paste into my AI Coding Assistant, which has the Higgsfield MCP connected. The AI will use that prompt to generate a complete narrated motion-graphics video end to end.\n\nTOPIC: [your topic]\nTARGET LENGTH: [e.g. 90 seconds]\nVISUAL STYLE: [describe the look in concrete nouns \u2014 materials, textures, palette, line quality, camera behavior]\n\nWrite the build prompt so it contains all of the following, explicitly:\n\n1. STYLE BIBLE\n   - A locked style description written so that shot 40 looks identical to shot 1\n   - Color palette with specific hex values\n   - Texture and material rules\n   - Typography rules for on-screen text\n   - Camera and motion rules (what moves, what never moves)\n   - An explicit \&quot;never do this\&quot; list to prevent style drift\n\n2. SCRIPT\n   - A complete voiceover script, written to be spoken, at the target length\n   - Broken into numbered beats\n   - Every factual claim marked with [FACT] so I can verify before render\n\n3. SHOT LIST\n   - One entry per beat: shot number, duration, what&#x27;s on screen, what the VO says over it\n   - Each shot&#x27;s image/video generation prompt written out in full\n   - The style bible referenced or restated in every single shot prompt\n\n4. ON-SCREEN TEXT\n   - Exact wording for every label, number, arrow annotation, and caption\n   - Placement notes\n\n5. AUDIO\n   - Voiceover generation instructions including tone, pace, and voice character\n   - Timing notes so VO and visuals land together\n\n6. ASSEMBLY\n   - Instructions to write all assets and the final video to a clearly named local folder\n\nOutput the build prompt only. No preamble, no explanation, no commentary. I am pasting it directly into the AI Coding Assistant.\n```\n\n---\n\n## Part 3: Style Recipes\n\nDrop recipes into `VISUAL STYLE:` field in generator.\n\n#### Vox-Style Paper Cutout\nPaper-cutout collage. Old photos with coarse halftone dots, rough paper edges, soft drop shadow. Elements look like real layers. Hand-drawn arrows in one accent color. Flat muted background, warm paper texture. Data shown as cut-paper bar charts and dotted maps. Text: bold condensed sans, lowercase. Camera: slow 2D pushes and slides. Elements snap in on beat. No 3D, no gradients, no lens flares, no glow.\n\n#### Bright Cartoon\nBright cartoon. Thick outlines, flat colors, high saturation: orange, teal, pink, yellow on clean light background. Round friendly characters, exaggerated shapes. Bouncy motion with squash, stretch, overshoot. Text: chunky round sans. Camera: fast whip transitions, pop-in reveals, bounce on settle. No realistic textures, no dark colors, no slow moves.\n\n#### Whiteboard Doodle\nWhiteboard doodle. Clean white board, black dry-erase marker with wobble and variable line weight, drawn on live. One or two accent marker colors for arrows. Simple stick figures and box diagrams. Text: hand-written marker style. Camera: slow pans across wide board, pushes on details. No extra color fills, no photos, no gradients.\n\n#### Pixel Art\nPixel art, 16-bit style. Fixed pixel grid, zero sub-pixel movement. 16 color limit. Dithering for shading. Readable sprites. Text: bitmap font, pixel-perfect, no anti-aliasing. Motion: low frame rate step animation. Camera: hard cuts, grid scrolls. No smooth motion, no modern effects.\n\n#### Isometric Flat Vector\nIsometric flat vector. 30-degree isometric view across all shots. Flat colors with soft shadows, no gradients. Muted palette: dusty blue, soft coral, warm grey, one main accent color. Buildings, devices built as blocks. Text: clean geometric sans. Camera: slow isometric drift. No perspective distortion, no complex lighting.\n\n---\n\n#### Custom Style Interrogator Prompt\n\nNot sure about visual style? Run prompt in main AI Chat first:\n\n```text\nI want to develop a signature motion-graphics style for my channel. I&#x27;m going to describe what I have in mind loosely, and I want you to interrogate it into something precise and reproducible.\n\nHere&#x27;s the vague version: [describe it however it comes out \u2014 references, vibes, half-formed ideas]\n\nAsk me the questions you need to pin down: materials and textures, exact palette, line quality, how things enter and exit frame, camera behavior, typography, and what the style must never do.\n\nThen output a single VISUAL STYLE paragraph, written in concrete physical nouns rather than adjectives, specific enough that a generation model produces the same look on shot 1 and shot 40. Include an explicit \&quot;never\&quot; list.\n```\n\n---\n\n## Part 4: AI Coding Assistant Command\n\nAfter making prompt in AI Chat, run command in AI Coding Assistant:\n\n```bash\nTake that prompt and build it.\n```\n\n#### Advanced Command (More Control)\n```bash\nTake that prompt and build it. Before generating anything, show me the shot list and wait for my approval. Then generate all shots, lock the style reference across every one, generate the voiceover, time the blocks so audio and visuals land together, and write the finished project plus every individual asset to ./[project-name]/\n```\n\n---\n\n## Part 5: Extra Workflows\n\n#### Language Translation\n```text\nMake a version of this video in Spanish. Regenerate the voiceover with a native-sounding delivery in the same tone and pace as the original, retime the blocks to fit the new audio length, translate all on-screen text and re-render the affected shots, and keep the visual style byte-for-byte identical. Write it to ./[project-name]-es/\n```\n\n#### Motion Graphic Overlays\n```text\nI need individual motion-graphic elements to composite over footage I already recorded. Not a full video.\n\nVISUAL STYLE: [paste a style recipe]\n\nGenerate these as standalone assets with transparent backgrounds where possible:\n1. [e.g. an animated arrow pointing down-left, drawing on over 0.6s, holding, then drawing off]\n2. [e.g. a bar chart building from zero to three bars labeled 2019, 2022, 2025]\n3. [e.g. a lower-third name plate that slides in from frame left]\n\nFor each: specify duration, output at 1080p or higher, and write to ./elements/ with descriptive filenames.\n```\n\n#### Product Explainer Video\n```text\nBuild a product explainer video.\n\nPRODUCT: [name and what it actually does]\nAUDIENCE: [who&#x27;s watching and what they currently believe]\nTHE ONE THING THEY SHOULD UNDERSTAND AFTER WATCHING: [single sentence]\nLENGTH: [e.g. 60 seconds]\nVISUAL STYLE: [paste a style recipe]\n\nStructure: open on the problem as the audience experiences it, show the mechanism of the solution visually rather than describing it, close on the outcome. No feature lists. Every claim marked [FACT] for my verification.\n```\n\n#### Course Lesson Video\n```text\nBuild a course lesson video.\n\nCONCEPT: [what you&#x27;re teaching]\nLEARNER STARTS KNOWING: [prerequisite level \u2014 be honest]\nLEARNER SHOULD BE ABLE TO DO AFTER: [concrete capability]\nLENGTH: [e.g. 4 minutes]\nVISUAL STYLE: [paste a style recipe]\n\nStructure it around the one thing learners typically get wrong about this concept. Build the visual metaphor early and return to it. Every claim marked [FACT].\n```\n\n---\n\n## Part 6: Two Big Mistakes\n\n#### Mistake 1: Fact Check After Render\nText and numbers on screen look authoritative. Wrong numbers mean re-rendering whole shots. Check facts first.\n\n**Pre-Render Fact-Check Prompt:**\n```text\nHere is my script. Every claim marked [FACT] needs verification before I render a single frame.\n\nFor each one: state whether it&#x27;s accurate, cite the source, give me the correct figure if it&#x27;s wrong, and flag anything that&#x27;s technically true but misleading in context.\n\nBe blunt. I&#x27;d rather kill a claim now than regenerate a shot later.\n\n[paste script]\n```\n\n#### Mistake 2: Using Default Stock Presets\nPresets make videos look generic. Use **Custom Style Interrogator** to build unique look.\n\n---\n\n## Part 7: Alternate Web App Workflow\n\nNo AI Coding Assistant? Use Web App:\n1. Make prompt in main AI Chat.\n2. Open **Higgsfield Explainer** web tool.\n3. Paste prompt and pick preset (Pixel Art, Claymotion, Papercraft, Cartoon, Whiteboard, Flat Vector).&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/motion-graphics-in-ai&quot;,&quot;rel_md_path&quot;:&quot;Guides/motion-graphics-in-ai.md&quot;}"></div>

<div class="js-card-render" data-item="{&quot;id&quot;:&quot;raw-footage-to-finished-video-in-ai&quot;,&quot;slug&quot;:&quot;raw-footage-to-finished-video-in-ai&quot;,&quot;name&quot;:&quot;Raw Footage to Finished Video \u2014 AI Setup &amp; Workflow Guide&quot;,&quot;description&quot;:&quot;An AI setup guide utilizing open-source tools and HyperFrames to automatically edit, score, and caption raw video footage without Premiere.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Skool&quot;,&quot;Community&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;Turn raw video clips into captioned, scored, motion-graphic edited final videos directly inside your AI workspace. No Premiere or terminal experience needed.\n\n---\n\n## Overview\n\n#### What You Are Building\nA single AI setup that takes a raw clip and outputs a captioned, scored, motion-graphic edited video.\n\n#### How It Works\n- `video-use`: Free open-source skill that reads transcript, finds cut points, and runs the main edit.\n- `HyperFrames`: Code-based graphic generator called by `video-use` when visual elements are needed. You only talk to `video-use`.\n\n---\n\n## Setup (One-Time)\n\n1. Copy the `video-use` link from community files.\n2. Paste link into AI Code tab and prompt:\n   \&quot;Read install file first, install repo, set up FFmpeg, register skill, and prompt me for my key when needed.\&quot;\n3. Paste ElevenLabs API key when prompted during first edit run.\n\n---\n\n## Workflow\n\n#### 1. Rough Cut\nPut raw video into project folder and prompt:\n\&quot;Start new project for raw clip and make rough cut.\&quot;\n\nAI uses Scribe for word-level timestamps, flags filler words and pauses, shows cut plan, and waits for approval.\n\nFix-it prompts:\n- \&quot;Add a bit more padding before that sentence.\&quot;\n- \&quot;Remove the word &#x27;basically&#x27; at start of line.\&quot;\n\n&gt; [!IMPORTANT]\n&gt; Lock rough cut before adding graphics to avoid timing misalignment later.\n\n---\n\n#### 2. Graphics\nOpen new chat for graphics phase and prompt:\n\&quot;Plan motion graphic for each segment, then build.\&quot;\n\nRefinement prompts:\n- \&quot;Use primary brand orange instead of default blue.\&quot;\n- \&quot;Place logo PNG on intro graphic.\&quot;\n- \&quot;Slow down entrance animation speed.\&quot;\n\nEach tweak only re-renders affected section.\n\n---\n\n#### 3. Captions\nPrompt:\n\&quot;Add captions using existing transcript.\&quot;\n\nGenerated using existing Scribe timestamps.\n\n---\n\n#### 4. Music\nPoint AI to audio file and set volume level (recommended **-22 to -23 dB** for background voice balance):\n\&quot;Add background music using this track at -22 dB.\&quot;\n\n---\n\n#### 5. Export\nPrompt:\n\&quot;Export final video.\&quot;\n\nFinal file saves to downloads directory; source project folder remains intact.\n\n---\n\n## Summary Prompt Reference\n\n| Phase | Command / Prompt |\n| :--- | :--- |\n| **Setup** | `\&quot;Read install file first, install repo, set up FFmpeg, register skill, and prompt me for key when needed.\&quot;` |\n| **Rough Cut** | `\&quot;Start new project for raw clip and make rough cut.\&quot;` |\n| **Graphics** | `\&quot;Plan motion graphic for each segment, then build.\&quot;` |\n| **Captions** | `\&quot;Add captions using existing transcript.\&quot;` |\n| **Export** | `\&quot;Export final video.\&quot;` |\n\n---\n\n## Key Notes\n\n- Word-level Scribe timestamps give accurate cut placement.\n- Use natural language prompts for edits instead of manual timeline trimming.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/raw-footage-to-finished-video-in-ai&quot;,&quot;rel_md_path&quot;:&quot;Guides/raw-footage-to-finished-video-in-ai.md&quot;}"></div>
