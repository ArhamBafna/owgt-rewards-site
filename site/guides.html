<div class="js-card-render" data-item="{&quot;id&quot;:&quot;the-ai-research-system&quot;,&quot;slug&quot;:&quot;the-ai-research-system&quot;,&quot;name&quot;:&quot;The AI Research System: A Three-Phase Method&quot;,&quot;description&quot;:&quot;A systematic three-phase methodology for conducting high-quality, verifiable research using multiple AI models (Perplexity, Grok, Claude, ChatGPT) to avoid hallucinations and generate actionable insights.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Research&quot;,&quot;Workflow&quot;,&quot;Perplexity&quot;,&quot;Claude&quot;,&quot;ChatGPT&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;The output quality of AI research is not determined by which model you use, but by whether you have a process at all. Using one model as your only source is using a single, fallible voice as your entire evidence base. \n\nA better approach is a three-phase process where each phase uses a different tool for a specific job: Gather, Analyze, and Output.\n\n#### Phase 1: Gather\n*The goal is source discovery, web research, market data, and current events. You are looking for sourced, traceable starting material, not AI opinions.*\n\n- **Perplexity**: Search-first AI that always cites sources. It links every answer to the original source material.\n  - *Best Practice*: Ask specific questions. Instead of \&quot;Tell me about competitor X\&quot;, ask: \&quot;What has competitor X announced in the last 90 days? What do their recent job postings suggest about their strategic direction? Cite all sources.\&quot;\n- **Grok**: For real-time intelligence. Connected directly to X data. Use this to track fast-moving markets, competitor announcements, or regulatory developments that haven&#x27;t been indexed by search engines yet.\n\n*Phase 1 Output*: A set of raw, sourced notes, links, and data points ready for synthesis.\n\n#### Phase 2: Analyze\n*The goal is summarizing findings, identifying patterns, synthesizing across sources, extracting key points, and pressure-testing interpretations.*\n\n- **Claude**: Built for long-form thinking, identifying patterns, and synthesizing across multiple sources.\n\n**Key Synthesis Prompts for Claude:**\n- **Research Synthesis**:\n  &gt; I have gathered the following research on [topic]. Synthesize it into a briefing of no more than one page covering: the three most important findings, what these findings mean for our business specifically, the key areas of uncertainty or conflicting evidence, and the one or two questions that still need to be answered before we can act with confidence. Research: [paste in your phase one notes]\n- **Competitive Intelligence**:\n  &gt; Build me a competitive intelligence brief on [competitor]. Based on the following sources and what you know, cover: their current product positioning and how it has changed recently, pricing strategy and packaging, go-to-market approach and primary channels, known strengths and vulnerabilities, recent signals about their strategic direction, and one or two things they are likely to do next. Sources: [paste in your phase one notes]\n- **Industry Trend Analysis**:\n  &gt; Analyze the following trends affecting [your industry]: [list what you found]. For each trend: how material it is likely to be in the next two to three years, whether it represents a threat or an opportunity for our business specifically, what leading companies in our space are doing in response, and what we should be doing now to either capitalize on or protect against it.\n\n**Common Mistakes to Avoid:**\n1. **Trusting first outputs**: Always ask Claude to identify the weakest assumption in its own analysis.\n2. **Weak prompting**: Specificity separates useful synthesis from generic summaries.\n3. **Shallow sourcing**: Phase two cannot fix poor data from phase one. Always verify factual claims against primary sources.\n\n#### Phase 3: Output\n*The goal is turning synthesized insights into a tailored deliverable (reports, memos, briefings).*\n\n- **Claude**: Best for reports, memos, strategy documents, written briefs, and anything requiring voice and judgment.\n- **ChatGPT**: Best for structured formats, data-heavy summaries, and content where pattern/completeness matters more than prose quality.\n\n**The Output Prompt:**\n&gt; I have the following research that I need to present to [audience, leadership, board, client, team]: [describe or paste in your phase two synthesis]. Help me turn this into a narrative that: opens with the single most important finding, builds the supporting evidence in a logical sequence, explains what the data means for our strategy or decisions, and closes with a clear recommendation or call to action. The audience cares most about: [describe what matters to them]&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/the-ai-research-system&quot;,&quot;rel_md_path&quot;:&quot;Guides/the-ai-research-system.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;top-ai-courses-for-beginners&quot;,&quot;slug&quot;:&quot;top-ai-courses-for-beginners&quot;,&quot;name&quot;:&quot;Top AI Courses for Beginners&quot;,&quot;description&quot;:&quot;A curated list of foundational AI and Machine Learning courses from top platforms, ideal for absolute beginners wanting to learn generative AI and ethics.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Skool&quot;,&quot;Community&quot;,&quot;Guide&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;The following is a comprehensive list of recommended courses on Artificial Intelligence (AI) and Machine Learning (ML), curated from leading technology companies and prestigious academic institutions. This guide is designed to help you find the right course for your skill level and career goals, whether you are a complete beginner or an aspiring professional. The courses are categorized by creator and cover a range of topics from foundational concepts and practical coding to ethical considerations and prompt engineering.\n\n---\n\n## Foundational AI Courses\n\n#### Introduction to Generative AI\nThis course is perfect for beginners and offers practical labs. It focuses on generative AI, a technology that allows you to create new content such as text, images, and code. Participants can experiment and learn by doing, which makes the learning process engaging and effective.\n\n* **Creator:** Cloud Skills Boost platform\n* **For whom:** Absolute beginners.\n* **What you&#x27;ll learn:** The basics of generating text, images, and code + practical labs.\n* **Time:** ~1 hour\n* **\ud83d\udd17 Link:** https://www.cloudskillsboost.google/course_templates/536\n\n#### Responsible AI\nThis course focuses on the ethical aspects of AI, discussing issues such as bias, fairness, and building ethical AI tools. It provides practical tips on how to create AI solutions that respect social values.\n\n* **Creator:** Cloud Skills Boost\n* **For whom:** Anyone who wants to understand the ethics of AI (bias, fairness, safety).\n* **Time:** ~1 hour\n* **\ud83d\udd17 Link:** https://www.cloudskillsboost.google/course_templates/554\n\n#### Introduction to AI and Machine Learning\nAn accelerated course for aspiring machine learning engineers that includes coding exercises. It&#x27;s a great way to gain practical skills in building and deploying machine learning models.\n\n* **Creator:** Cloud Skills Boost\n* **For whom:** Future ML Engineers (requires basic technical knowledge).\n* **What you&#x27;ll learn:** The basics of AI/ML, cloud tools.\n* **\ud83d\udd17 Link:** https://www.cloudskillsboost.google/course_templates/593\n\n---\n\n## Academic &amp; Comprehensive Courses\n\n#### CS50: Introduction to AI with Python\nOne of the most in-depth introductory courses to AI at the university level. It covers a wide range of topics, including search, machine learning, natural language processing, and more. This course is an excellent choice for those who want to gain a thorough understanding of the fundamentals of AI.\n\n* **Creator:** Harvard University\n* **For whom:** Those seeking deep, academic knowledge.\n* **What you&#x27;ll learn:** Search algorithms, ML, NLP, neural networks.\n* **Time:** ~16 hours\n* **\ud83d\udd17 Link:** https://pll.harvard.edu/course/cs50s-introduction-artificial-intelligence-python\n\n#### AI for Beginners\nA complete curriculum consisting of 12 lessons, 24 labs, and real-world projects. This course offers a comprehensive introduction to AI, allowing participants to gain practical skills by working on real projects.\n\n* **Creator:** Microsoft\n* **For whom:** Systematic learners who enjoy projects.\n* **What you&#x27;ll learn:** A full curriculum in 12 lessons: from neurons to NLP + 24 labs.\n* **\ud83d\udd17 Link:** https://github.com/microsoft/AI-For-Beginners\n\n#### Machine Learning with Python\nPart of a professional AI certificate. This course focuses on supervised and unsupervised learning, as well as real-world use cases. It&#x27;s a great opportunity to learn how to apply machine learning techniques in practice.\n\n* **Creator:** IBM (on Coursera)\n* **For whom:** Practitioners who want to learn ML (supervised/unsupervised learning).\n* **Time:** ~16 hours\n* **\ud83d\udd17 Link:** https://www.coursera.org/learn/machine-learning-with-python\n\n#### Prompt Engineering for AI Models\nCreated in collaboration with leading AI researchers, this course teaches you how to create better prompts for real-world applications. It&#x27;s a unique opportunity to learn how to effectively communicate with large language models and generative AI systems.\n\n* **Creator:** DeepLearning.AI (Andrew Ng)\n* **For whom:** All users of AI text and image generation models.\n* **What you&#x27;ll learn:** How to effectively create prompts for specific tasks.\n* **\ud83d\udd17 Link:** https://www.deeplearning.ai/short-courses/chatgpt-prompt-engineering-for-developers/\n\n#### AI for Everyone\nA non-technical course that helps you understand how to think about and work with AI. It is an excellent choice for people who want to understand the impact of AI on business and society, without getting into the technical details.\n\n* **Creator:** Andrew Ng (Stanford) on Coursera\n* **For whom:** Non-technical managers, entrepreneurs, the curious.\n* **What you&#x27;ll learn:** How to think about AI, implement it in business, and understand its impact.\n* **Time:** ~16 hours\n* **\ud83d\udd17 Link:** https://www.coursera.org/learn/ai-for-everyone\n\n#### AI Fundamentals\nPart of a series of AI certificates for beginners, including quizzes and badges. This course offers an introduction to fundamental AI concepts, allowing participants to earn a certificate that confirms their skills.\n\n* **Creator:** IBM (on Coursera)\n* **For whom:** Beginners who want to earn an AI certificate.\n* **What you&#x27;ll learn:** Fundamental AI concepts, business applications + quizzes.\n* **\ud83d\udd17 Link:** https://www.coursera.org/learn/applied-artifical-intelligence-ibm-watson-ai&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/top-ai-courses-for-beginners&quot;,&quot;rel_md_path&quot;:&quot;Guides/top-ai-courses-for-beginners.md&quot;}"></div>
<div class="js-card-render" data-item="{&quot;id&quot;:&quot;which-model-should-i-use&quot;,&quot;slug&quot;:&quot;which-model-should-i-use&quot;,&quot;name&quot;:&quot;Which Model Should I Use? (Field Guide)&quot;,&quot;description&quot;:&quot;A strategic framework for choosing the right AI model for the job and deciding how much \&quot;effort\&quot; or \&quot;thinking time\&quot; to give it, maximizing productivity while saving costs and credits.&quot;,&quot;category&quot;:&quot;Guides&quot;,&quot;folder_category&quot;:&quot;Guides&quot;,&quot;category_slug&quot;:&quot;guides&quot;,&quot;tags&quot;:[&quot;Workflow&quot;,&quot;Strategy&quot;,&quot;Best Practices&quot;,&quot;AI Models&quot;],&quot;url&quot;:&quot;&quot;,&quot;content&quot;:&quot;When working with AI, you are essentially choosing which person to call and how long to let them think. Every company stacks their models the same three ways:\n\n#### The Three Personas of AI Models\n1. **The Staff (e.g., Claude Sonnet, ChatGPT Luna)**: Fast, cheap, and good at almost everything that fills a normal day. Start here, and you will be right most of the time. (Cost: ~2 coins)\n2. **The Manager (e.g., Claude Opus, ChatGPT Terra)**: You go to this one when the work actually matters. A serious document, a harder problem, a plan you are going to build on top of. (Cost: ~5 coins)\n3. **The Consultant (e.g., Claude Fable, ChatGPT Sol)**: Brilliant, expensive, and slow. You bring this one in for the hard part, and then you let them go. (Cost: ~10 coins)\n\n**Rule of Thumb**: Can the staff do it? Yes. Is it worth paying the consultant? Probably not.\n\n#### The Effort Dial (Thinking Time)\nEvery model has a dial controlling how long it thinks before answering.\n- **LOW**: Simple work in volume. Fast and cheap.\n- **MEDIUM**: The everyday setting. Good results without the wait.\n- **HIGH**: Real thinking. Hard problems and the final check.\n- **MAX**: The one decision everything else hangs on.\n\n*Note*: Pushing the dial all the way up for ordinary work causes the AI to overthink. Start lower than feels right and climb only when the answer disappoints you. The dial controls thinking, not talking.\n\n#### Workflows by Task Type\n\n- **Errands (Web searches, lookups, quick edits, summaries)**\n  - *Who*: Staff\n  - *Setting*: LOW\n  - *Why*: The expensive model and the cheap one bring back the same answer, but the cheap one is faster. \n- **Writing (Copy and Emails)**\n  - *Who*: Manager decides, Staff drafts\n  - *Setting*: MEDIUM\n  - *Why*: A piece is settled before the first sentence is written. Plan with the manager, let the staff type.\n- **Documents &amp; PDFs**\n  - *Who*: Manager plans, Staff builds\n  - *Setting*: MEDIUM, THEN LOW\n- **Deep Research**\n  - *Who*: Manager\n  - *Setting*: LOW TO MEDIUM\n  - *Why*: Research runs on finding good sources, not overthinking them.\n- **Slide Decks**\n  - *Who*: Staff builds, Consultant polishes\n  - *Setting*: MEDIUM, THEN HIGH\n- **Spreadsheets**\n  - *Who*: Staff (one sheet) or Consultant (many sheets)\n  - *Setting*: MEDIUM or HIGH\n- **Websites and Apps**\n  - *Who*: Consultant plans, Staff builds\n  - *Setting*: HIGH, THEN LOW\n\n#### The Paragraph That Pays For Itself\nThe smartest models are incredibly wordy. You pay for every word. Use this standing order (as a Custom Instruction, Skill, or Text Expander snippet) to cut costs and save time:\n\n&gt; Lead with the answer. Give me the outcome in the first sentence, then the reasoning underneath it, and stop there. Do not repeat my question back to me. Do not tell me what you are about to do. Do not summarize what you just did. Keep caveats to one line. Match the length to the ask, and when I ask for something short, short wins over complete. Do what I asked for and nothing next to it. If you think the ask is wrong, say so in one sentence and then do it anyway. Do not add a verification pass unless I ask for one. You already check your own work.&quot;,&quot;is_shallow&quot;:false,&quot;path&quot;:&quot;/items/guides/which-model-should-i-use&quot;,&quot;rel_md_path&quot;:&quot;Guides/which-model-should-i-use.md&quot;}"></div>
